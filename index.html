<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Math: Zero → Hero · Your personal tracker</title>
<style>
:root{
  --bg:#070b16; --bg2:#0b1120; --card:#0f1728; --card2:#131e33; --line:#1e2b45; --line2:#2a3a58;
  --txt:#e8eefc; --mut:#93a4c3; --dim:#64748f;
  --acc:#6366f1; --acc2:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --grad:linear-gradient(135deg,#6366f1,#22d3ee);
  --r:16px; --rs:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:
 radial-gradient(900px 520px at 8% -8%,rgba(99,102,241,.22),transparent 62%),
 radial-gradient(760px 460px at 96% 0%,rgba(34,211,238,.15),transparent 60%),
 radial-gradient(680px 520px at 50% 115%,rgba(168,85,247,.12),transparent 60%);
 pointer-events:none;z-index:0}
body::after{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;opacity:.55}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 90px}
header.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:rgba(7,11,22,.82);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:900;color:#06121f;font-size:15px;flex:0 0 auto}
.brand small{display:block;font-weight:500;color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.topbar{flex:1 1 320px;min-width:220px;height:34px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 12px;display:flex;align-items:center;gap:10px}
.topbar .bar{flex:1;height:8px;background:#0a1120;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.topbar .bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.topbar b{font-size:12px;color:var(--txt);white-space:nowrap}
nav.tabs{position:sticky;top:55px;z-index:35;display:flex;gap:6px;overflow-x:auto;padding:10px 2px;margin:0 -2px;scrollbar-width:none;background:linear-gradient(180deg,rgba(7,11,22,.96),rgba(7,11,22,.72) 70%,transparent)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.16s}
.tab:hover{color:var(--txt);border-color:var(--line2)}
.tab.on{background:var(--grad);color:#06121f;border-color:transparent}
main{padding-top:14px}
h1{font-size:clamp(24px,4vw,36px);line-height:1.15;margin:6px 0 8px;letter-spacing:-.03em}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
h3{font-size:16px;margin:0}
.sub{color:var(--mut);margin:0 0 18px;max-width:76ch}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:linear-gradient(135deg,rgba(99,102,241,.20),rgba(34,211,238,.10)),linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:20px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.22),transparent 65%)}
.hero .tagline{color:var(--acc2);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:16px 0}
.stat{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .l{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.stat.good .n{color:var(--ok)} .stat.warn .n{color:var(--warn)} .stat.acc .n{color:var(--acc2)}
.btn{border:1px solid var(--line2);background:var(--card2);color:var(--txt);padding:10px 15px;border-radius:11px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.16s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{transform:translateY(-1px);border-color:var(--acc)}
.btn.pri{background:var(--grad);border-color:transparent;color:#06121f}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.ghost{background:transparent}
.btn.dang{border-color:rgba(251,113,133,.4);color:#fecdd3}
.btn.dang:hover{background:rgba(251,113,133,.14)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:10px;background:#0a1120;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:6px}
.stage{border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden;background:linear-gradient(180deg,rgba(19,30,51,.7),rgba(15,23,40,.7))}
.stage-h{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;user-select:none;background:transparent;border:0;width:100%;text-align:left;color:inherit;font:inherit}
.stage-h:hover{background:rgba(99,102,241,.07)}
.emo{font-size:22px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#0a1120;border:1px solid var(--line2);flex:0 0 auto}
.stage-h .mid{flex:1;min-width:0}
.stage-h .t{font-weight:800;letter-spacing:-.02em;font-size:16px}
.stage-h .d{color:var(--dim);font-size:12.5px}
.pill{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);background:#0a1120;color:var(--mut);white-space:nowrap}
.pill.done{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45);color:#a7f3d0}
.pill.now{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.45);color:#fde68a}
.stage-b{padding:0 16px 16px;border-top:1px solid var(--line)}
.goal{background:rgba(99,102,241,.09);border:1px solid rgba(99,102,241,.3);border-left:3px solid var(--acc);padding:11px 13px;border-radius:11px;margin:14px 0;font-size:13.5px;color:#dbe4ff}
.mod{margin:14px 0 0}
.mod-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mod-h .mt{font-weight:800;font-size:14.5px;letter-spacing:-.01em}
.mod-h .bar{flex:1;min-width:60px}
.topic{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:rgba(10,17,32,.55);transition:.16s}
.topic:hover{border-color:var(--line2)}
.topic.done{background:rgba(52,211,153,.06);border-color:rgba(52,211,153,.28)}
.topic.done .tname{text-decoration:line-through;color:var(--mut)}
.cbx{appearance:none;width:22px;height:22px;border:2px solid var(--line2);border-radius:7px;background:#0a1120;cursor:pointer;flex:0 0 auto;margin-top:2px;position:relative;transition:.15s}
.cbx:hover{border-color:var(--acc2)}
.cbx:checked{background:var(--ok);border-color:var(--ok)}
.cbx:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#04150e;font-weight:900;font-size:14px}
.tmain{flex:1;min-width:0}
.tname{font-weight:700;font-size:14px}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.tmeta span{font-size:11px;color:var(--dim)}
.tmeta .hrs{color:var(--acc2);font-weight:700}
.tact{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.mini{border:1px solid var(--line);background:#0a1120;color:var(--mut);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center}
.mini:hover{color:var(--txt);border-color:var(--acc2)}
.mini.on{background:rgba(99,102,241,.2);border-color:var(--acc);color:#c7d2fe}
.steps{margin-top:10px;padding:12px;border-radius:11px;background:#080e1b;border:1px dashed var(--line2)}
.steps ol{margin:0 0 8px;padding-left:20px}
.steps li{margin:5px 0;font-size:13.5px;color:#d5ddf0}
.mastery{font-size:13px;color:#fde68a;background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.25);border-radius:9px;padding:8px 10px;margin:8px 0}
.mastery b{color:#fff}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.links a{font-size:11.5px;color:var(--acc2);text-decoration:none;border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.08);padding:4px 9px;border-radius:999px}
.links a:hover{background:rgba(34,211,238,.2)}
textarea.note{width:100%;margin-top:8px;background:#080e1b;border:1px solid var(--line2);color:var(--txt);border-radius:9px;padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;min-height:56px;resize:vertical}
input[type=text],input[type=number],input[type=date],select{background:#080e1b;border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(99,102,241,.55);outline-offset:1px}
input[type=checkbox]{accent-color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.qbox{text-align:center;padding:18px 14px}
.qtext{font-size:clamp(28px,7vw,46px);font-weight:800;letter-spacing:-.02em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0 14px}
.ans{width:min(280px,100%);font-size:22px;text-align:center;font-family:ui-monospace,monospace;letter-spacing:.04em}
.scorerow{display:flex;justify-content:space-between;gap:10px;color:var(--mut);font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);background:#0a1120;color:var(--mut);padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer}
.chip.on{background:rgba(99,102,241,.2);border-color:var(--acc);color:#c7d2fe}
.flash{min-height:130px;display:grid;place-items:center;background:#080e1b;border:1px dashed var(--line2);border-radius:14px;padding:16px;cursor:pointer}
.flash .q{font-size:26px;font-weight:800;font-family:ui-monospace,monospace}
.flash .a{font-size:30px;font-weight:800;color:var(--ok)}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:5px}
.hd{aspect-ratio:1;border-radius:4px;background:#0a1120;border:1px solid var(--line)}
.hd.l1{background:rgba(52,211,153,.28);border-color:transparent}
.hd.l2{background:rgba(52,211,153,.55);border-color:transparent}
.hd.l3{background:rgba(52,211,153,.9);border-color:transparent}
.hd.today{outline:2px solid var(--acc2)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tbl tr:hover td{background:rgba(99,102,241,.05)}
.acc-h{display:flex;gap:12px;align-items:center;width:100%;background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;padding:14px 0;text-align:left}
.acc-h .emo{width:38px;height:38px;font-size:19px}
.acc-b{padding:0 0 14px 0}
.acc-b h4{margin:14px 0 6px;font-size:13px;color:var(--acc2);text-transform:uppercase;letter-spacing:.08em}
.acc-b ul{margin:6px 0;padding-left:20px}
.acc-b li{margin:6px 0;font-size:14px}
.acc-b a{color:#a5b4fc;text-decoration:none;border-bottom:1px dotted rgba(165,180,252,.5);word-break:break-all}
.acc-b a:hover{color:#fff}
.acc-b code{background:#0a1120;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12.5px;color:#a5f3fc}
.empty{color:var(--dim);font-size:14px;padding:16px;text-align:center}
.searchbar{position:relative;flex:1;min-width:180px}
.searchbar input{width:100%;padding-left:34px}
.searchbar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
footer{color:var(--dim);font-size:12px;text-align:center;padding:26px 0 8px;border-top:1px solid var(--line);margin-top:26px}
.modal-bg{position:fixed;inset:0;background:rgba(3,6,14,.82);backdrop-filter:blur(6px);display:none;z-index:80;padding:18px;overflow:auto}
.modal-bg.on{display:grid;place-items:center}
.modal{max-width:560px;width:100%;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:20px;padding:22px}
.kbd{border:1px solid var(--line2);background:#0a1120;border-radius:6px;padding:1px 7px;font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#0b1a14;border:1px solid rgba(52,211,153,.5);color:#bbf7d0;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;transition:.28s;z-index:90;pointer-events:none;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.wk{border:1px solid var(--line);border-radius:13px;padding:12px;background:rgba(10,17,32,.6)}
.wk .wh{font-weight:800;font-size:13.5px;color:var(--acc2);margin-bottom:5px}
.wk ul{margin:0;padding-left:17px;font-size:13px;color:var(--mut)}
.wk li{margin:3px 0}
@media(max-width:640px){
  .wrap{padding:0 11px 70px}
  .top-in{padding:9px 11px;gap:10px}
  .brand small{display:none}
  nav.tabs{top:52px;padding:9px 2px}
  .tab{padding:11px 15px;font-size:13.5px}
  h1{font-size:23px}
  .hero{padding:16px 14px;border-radius:16px}
  .card{padding:14px}
  .stats{grid-template-columns:repeat(2,1fr);gap:9px}
  .stat{padding:12px}
  .stat .n{font-size:22px}
  .cbx{width:30px;height:30px;border-radius:9px;margin-top:1px}
  .cbx:checked::after{font-size:18px}
  .topic{padding:13px 11px;gap:12px}
  .tname{font-size:14.5px}
  .btn{padding:12px 16px;font-size:14px}
  .btn.sm{padding:10px 13px;font-size:12.5px}
  .mini{width:38px;height:38px}
  .chip{padding:10px 14px;font-size:13px}
  .ans{font-size:26px;padding:14px;width:100%}
  .qtext{font-size:34px}
  .flash{min-height:160px}
  .flash .q{font-size:23px}
  .flash .a{font-size:27px}
  textarea.note{font-size:14px;min-height:74px}
  input[type=text],input[type=number],input[type=date],select{padding:12px;font-size:16px}
  .stage-h{padding:13px 11px;gap:10px}
  .emo{width:38px;height:38px;font-size:19px}
  .stage-h .t{font-size:15px}
  .heat{grid-template-columns:repeat(15,1fr);gap:4px}
  .tbl th,.tbl td{padding:11px 8px;font-size:13px}
  .steps li{font-size:14px}
  .toast{left:12px;right:12px;transform:translateY(20px);bottom:16px;text-align:center;border-radius:14px}
  .toast.on{transform:translateY(0)}
}
@media print{
  body{background:#fff;color:#000} body::before,body::after{display:none}
  header.top,nav.tabs,.no-print,.toast,.modal-bg{display:none!important}
  .card,.stage,.topic,.stat{background:#fff!important;border-color:#ccc!important;color:#000!important}
  .stage-b{display:block!important} .steps{display:block!important;background:#fafafa!important}
  .tname,.stage-h .t,.stat .n,h1,h2,h3{color:#000!important}
  .sub,.stage-h .d,.tmeta span,.acc-b li{color:#333!important}
  .goal{background:#f3f4ff!important;color:#111!important}
  a{color:#0b3bd6!important}
}

/* ================= PWA / phone-app shell ================= */
:root{--navh:62px}
html,body{overscroll-behavior-y:contain}
body{-webkit-tap-highlight-color:transparent}
button,.tab,.mini,.chip,.topic-h,.stage-h{touch-action:manipulation}

/* --- bottom tab bar (phones) --- */
.pwa-bottomnav{display:none}
@media(max-width:820px){
  body.pwa-nav .pwa-bottomnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:linear-gradient(180deg,rgba(11,17,32,.88),rgba(7,11,22,.98));
    -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
    border-top:1px solid var(--line);
    padding:5px 3px calc(5px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 30px rgba(0,0,0,.45)
  }
  .pwa-bottomnav button{
    flex:1 1 0;min-width:0;background:none;border:0;color:var(--dim);font:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;transition:.15s
  }
  .pwa-bottomnav button .i{font-size:19px;line-height:1;filter:grayscale(.35) opacity(.85)}
  .pwa-bottomnav button .l{font-size:9.5px;font-weight:700;letter-spacing:.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pwa-bottomnav button.on{color:var(--txt);background:rgba(99,102,241,.18)}
  .pwa-bottomnav button.on .i{filter:none;transform:translateY(-1px)}
  .pwa-bottomnav button.on .l{color:var(--acc2)}
  /* the old horizontally-scrolling tab strip is replaced by the bottom bar */
  body.pwa-nav nav.tabs{display:none}
  .wrap{padding-bottom:calc(var(--navh) + 46px + env(safe-area-inset-bottom))}
  main{padding-top:8px}
  /* thumb-friendly spacing */
  .topic{padding:14px 12px}
  .btn{padding:13px 17px}
  .cbx{width:32px;height:32px}
}
@media(max-width:400px){
  .pwa-bottomnav button .l{font-size:9px}
  .pwa-bottomnav button .i{font-size:18px}
}

/* installed / standalone: use the notch area properly */
@media(display-mode:standalone){
  header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0}
  .wrap{padding-top:2px}
  body::before{opacity:.85}
}

/* --- install card inside Settings --- */
.pwa-install-card{border-color:rgba(34,211,238,.35);background:linear-gradient(180deg,rgba(34,211,238,.06),rgba(10,17,32,.7))}
.pwa-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pwa-install-row{margin-top:10px}
.pwa-mut{font-size:12.5px;color:var(--dim)}
.pwa-ok{color:var(--ok)}
.pwa-btn{width:auto}

/* --- banners (install + backup) --- */
.pwa-banner{
  position:fixed;left:10px;right:10px;bottom:calc(var(--navh,62px) + 14px + env(safe-area-inset-bottom));z-index:80;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#141f36,#0d1526);border:1px solid var(--line2);border-radius:16px;
  padding:10px 12px;box-shadow:0 18px 40px rgba(0,0,0,.5);
  transform:translateY(26px);opacity:0;transition:.32s cubic-bezier(.2,.8,.2,1)
}
.pwa-banner.on{transform:translateY(0);opacity:1}
.pwa-banner img{border-radius:10px;flex:0 0 auto}
.pwa-banner-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.pwa-banner-t b{font-size:13.5px}
.pwa-banner-t span{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwa-x{background:none;border:0;color:var(--dim);font-size:15px;padding:6px;cursor:pointer;flex:0 0 auto}
.pwa-go{
  flex:0 0 auto;border:0;border-radius:11px;padding:10px 15px;font-weight:800;font-size:12.5px;cursor:pointer;
  background:var(--grad);color:#06121f
}

};

var STAGES=[
/* ============================ STAGE 0 ============================ */
{id:0,emo:"🐣",t:"Stage 0 · Absolute Zero",sub:"Counting, numbers, shapes, time, money",
 goal:"You can count confidently to 100+, read and write any number, compare numbers, read a clock, and handle money. Nothing else in this whole roadmap works until this is solid. Do NOT rush it.",
 mods:[
 {t:"Number Sense (the real foundation)",topics:[
  {n:"Counting forward 1–100",h:4,s:["Count out loud from 1 to 100 every single morning for 7 days (yes, out loud — it fixes the gaps).","Count real objects: coins, chapatis, pencils, steps. Touch each item and say its number.","Write 1–100 in rows of 10 on paper. Circle every 10th number and say what you notice."],m:"You can count 1→100 aloud with zero hesitation, and write 1→100 with no skips.",r:L.count},
  {n:"Counting backward from 100",h:3,s:["Count down 100→1 every day for 5 days.","Count down in steps of 2s, 5s and 10s (100, 95, 90 …).","Play: someone says a number, you say the number just below it, instantly."],m:"Backward counting from any number ≤100 is instant.",r:L.count},
  {n:"Skip counting by 2s, 5s, 10s",h:3,s:["Count by 10s to 100, then by 5s to 100, then by 2s to 100.","Fill in blanks: 10, 20, __, 40 …","Notice: skip counting by 10s IS the multiplication table of 10. You are already doing algebra."],m:"You can skip count by 2, 5, 10 forward and backward.",r:L.count},
  {n:"Reading & writing numerals ↔ words",h:3,s:["Write a number in digits, then write it in words (e.g. 47 = forty-seven).","Do 20 per day. Include tricky ones: 14, 40, 16, 60, 13, 30.","Read numbers off real life: house numbers, price tags, phone numbers, vehicle plates."],m:"Any number up to 1000 converts both ways correctly.",r:L.count},
  {n:"Place value: ones, tens, hundreds, thousands",h:5,s:["Draw a place-value table. Put 347 in it: 3 hundreds, 4 tens, 7 ones.","Build numbers with real objects: 10 sticks tied in a bundle = 1 ten.","Write the expanded form: 347 = 300 + 40 + 7. Do 20 numbers."],m:"You can break any 4-digit number into its place values and rebuild it.",r:L.count},
  {n:"Comparing & ordering: >, <, =",h:3,s:["Learn the crocodile rule: the open mouth always eats the bigger number.","Write 30 comparisons a day: 47 __ 74.","Order 5 given numbers from smallest to largest, then largest to smallest."],m:"Comparison of any two numbers up to 4 digits is instant and correct.",r:L.count},
  {n:"Even, odd & number patterns",h:3,s:["Even numbers end in 0,2,4,6,8. Odd end in 1,3,5,7,9. Sort 30 numbers.","Find the rule in a pattern: 3, 6, 9, 12, __ (add 3).","Create 5 patterns yourself and give them to a friend to solve."],m:"You can spot and extend a simple number pattern.",r:L.count}
 ]},
 {t:"Shapes, Measurement & Everyday Math",topics:[
  {n:"2D and 3D shapes",h:3,s:["Name and draw: square, rectangle, triangle, circle, oval, rhombus, trapezium.","Count sides and corners of each shape.","Find 3D shapes at home: box (cuboid), ball (sphere), can (cylinder), dice (cube)."],m:"You identify shapes by name, side count and corner count.",r:L.count},
  {n:"Measuring length, weight, volume",h:4,s:["Learn the units: mm, cm, m, km and g, kg and ml, l. Know 1 m = 100 cm, 1 kg = 1000 g.","Measure 10 objects at home with a ruler and write them down.","Weigh things on a kitchen scale; pour water into a measuring cup."],m:"You pick the right unit for a real object and measure it correctly.",r:L.count},
  {n:"Telling time (analog + digital)",h:4,s:["Learn the hour hand and minute hand. Start with exact hours (3:00).","Then half hours (3:30), then quarters, then every 5 minutes.","Wear an analog watch for a week and check the time on it 10 times a day."],m:"You read any analog clock time to the minute and convert it to digital.",r:L.count},
  {n:"Calendar: days, months, years",h:2,s:["Memorise the 12 months and the number of days in each (knuckle trick works).","Answer: what day was 15 days after a Tuesday?","Practise dates: today's date, your birthday, how many days between them."],m:"You can move forward and backward through dates confidently.",r:L.count},
  {n:"Money (₹) — coins, notes, totals, change",h:5,s:["Lay out real coins and notes. Know every denomination.","Count a set of coins: e.g. 3 × ₹10 + 4 × ₹5 = ₹50.","Practise giving change: item costs ₹73, you give ₹100 → change ₹27. Do 20 of these.","At the shop, mentally calculate the bill BEFORE the shopkeeper does."],m:"You can total a bill and work out change in your head.",r:L.count}
 ]},
 {t:"✅ Stage 0 Checkpoint",topics:[
  {n:"Checkpoint: prove Stage 0",h:2,s:["Write numbers 1–100 forward, then 100–1 backward — time yourself.","Do 20 comparisons (> < =) with 3-digit numbers.","Read 5 analog clock times and 5 money amounts aloud.","If you get under 90%, go back and redo the weak topic. No shame — this is the base of the whole building."],m:"9/10 correct on each mini-test above.",r:[]}
 ]}
]},
/* ============================ STAGE 1 ============================ */
{id:1,emo:"➕",t:"Stage 1 · The Four Operations",sub:"Add, subtract, multiply, divide — on paper and in your head",
 goal:"Arithmetic becomes automatic. This is the single biggest unlock: 90% of 'I am bad at math' is actually 'my addition and multiplication are slow'. Spend real time here.",
 mods:[
 {t:"Addition & Subtraction",topics:[
  {n:"Addition of single digits (+ the addition table)",h:6,s:["Understand: addition = combining. Use objects first (3 coins + 4 coins).","Learn the 'make 10' trick: 8+7 → 8+2+5 = 15. This is the master key to mental math.","Learn doubles (6+6), doubles+1 (6+7), and +9/+8 tricks (+9 = +10 − 1).","Drill 30 random single-digit additions daily for 2 weeks. Use the Daily Drill tab."],m:"Any two single-digit numbers added in under 2 seconds, mentally.",r:L.arith},
  {n:"Subtraction of single digits & fact families",h:5,s:["Subtraction = taking away AND = the gap between two numbers.","Learn fact families: if 7+5=12 then 12−5=7 and 12−7=5. Write 10 families.","Count-up strategy: 13−8 → count 8…9,10,11,12,13 = 5.","Drill 30 single-digit subtractions daily."],m:"Single-digit subtraction is instant; you can flip between + and −.",r:L.arith},
  {n:"Multi-digit addition with carrying",h:5,s:["Always line up the digits in columns (ones under ones). Add right to left.","When a column totals 10+, write the ones digit and carry the tens.","Do 15 problems a day, mixing 2, 3 and 4 digit numbers.","Check every answer by re-adding in the other direction or by estimating."],m:"You add any two numbers up to 5 digits with zero carrying errors.",r:L.arith},
  {n:"Multi-digit subtraction with borrowing",h:6,s:["Column method, right to left. If the top digit is smaller, borrow 1 from the left.","Master the hard case: borrowing across zeros (e.g. 4002 − 1567).","Do 15 problems daily.","CHECK EVERY ANSWER by adding the result back to the subtrahend. Non-negotiable."],m:"Borrowing across zeros works perfectly, and you always verify.",r:L.arith}
 ]},
 {t:"Multiplication & Division",topics:[
  {n:"Multiplication as repeated addition & arrays",h:4,s:["4 × 3 means 'four groups of three' = 3+3+3+3 = 12.","Draw arrays: 4 rows of 3 dots. Count them.","Also see it as 3 groups of 4 — this shows why 4×3 = 3×4 (commutative).","Any number × 0 = 0. Any number × 1 = itself."],m:"You can explain multiplication three ways (groups, array, repeated addition).",r:L.arith},
  {n:"Times tables 2, 5, 10 (start here)",h:6,s:["Table of 2 = even numbers. Table of 10 = add a zero. Table of 5 = ends in 0 or 5.","Write each table 5 times, say it aloud 5 times.","Drill randomly — not in order. Order-reciting is not knowledge.","15 minutes a day for a week."],m:"Tables 2, 5, 10 recalled instantly in random order.",r:L.arith},
  {n:"Times tables 3, 4, 6, 9",h:8,s:["9-trick: digits of the answer always sum to 9 (9×7=63, 6+3=9). Also 9×n = 10n − n.","4 = double the 2-table. 6 = double the 3-table. 3-table: sum of digits is a multiple of 3.","Do one table per day: write it, say it, drill it randomly, then mix with old tables.","Keep a table chart on your wall for 3 months."],m:"Tables up to 6 and 9 are instant.",r:L.arith},
  {n:"Times tables 7, 8, 11, 12 (the hard ones)",h:8,s:["7 and 8 are the hardest — do them with flashcards, 10 minutes daily, for 3 weeks.","8 = double the 4-table. 11 up to 9: repeat the digit (11×7=77). 12 = 10× + 2×.","Mix ALL tables randomly every day. Random recall is the only real test."],m:"Complete 1–12 table, random order, under 3 seconds per fact.",r:L.arith},
  {n:"Multiplying 2-digit and 3-digit numbers",h:8,s:["Learn the standard column method: multiply by the ones, then by the tens (shifted one place), then add.","Learn the grid / area method too — it explains WHY the standard method works.","Do 10 problems a day.","Estimate first (34 × 21 ≈ 30 × 20 = 600) to catch silly mistakes."],m:"You can multiply any two 3-digit numbers correctly and explain the steps.",r:L.arith},
  {n:"Division: sharing, grouping & the ÷ symbol",h:5,s:["Division = splitting into equal groups. 12 ÷ 3 = how many in each of 3 groups.","Division is the reverse of multiplication: 12 ÷ 3 = 4 because 4 × 3 = 12.","Practise all division facts that match your tables (up to 144 ÷ 12).","Division by zero is undefined — understand why (no number times 0 gives 5)."],m:"Basic division facts are instant because your tables are instant.",r:L.arith},
  {n:"Long division & remainders",h:8,s:["Learn the 4 steps: Divide, Multiply, Subtract, Bring down. Say them aloud each time.","Start with 2-digit divisors into 3-digit numbers, then go bigger.","Understand the remainder: 17 ÷ 5 = 3 remainder 2, i.e. 17 = 5×3 + 2.","ALWAYS check: quotient × divisor + remainder must equal the original number."],m:"You divide a 4-digit number by a 2-digit number and verify your answer.",r:L.arith},
  {n:"Multiples, factors & divisibility rules",h:5,s:["Factors of 12: 1,2,3,4,6,12. Multiples of 12: 12,24,36,…","Learn the tests: 2 (even), 3 (digit-sum), 5 (ends 0/5), 9 (digit-sum), 10 (ends 0), 4 (last two digits), 6 (both 2 and 3).","For any number, list all factors and the first 10 multiples."],m:"You can test divisibility by 2,3,4,5,6,9,10 without dividing.",r:L.arith}
 ]},
 {t:"Mixing it all together",topics:[
  {n:"Order of operations (brackets first)",h:4,s:["Rule: Brackets → Powers → Multiply/Divide (left to right) → Add/Subtract (left to right).","Solve 20 expressions with brackets: (5+3) × 2 = 16, but 5 + 3 × 2 = 11.","Write your own 5 tricky expressions and solve them twice, different order, to see why the rule exists."],m:"You never get 'left-to-right confusion' wrong again.",r:L.arith},
  {n:"Estimation & rounding (your safety net)",h:4,s:["Round to nearest 10, 100, 1000.","Before solving anything, estimate the answer. If your exact answer is miles off, you made a mistake.","Example: 487 + 312 ≈ 500 + 300 = 800. So an answer of 79 or 8000 is obviously wrong."],m:"You estimate every big calculation and catch your own errors.",r:L.arith},
  {n:"Word problems with the four operations",h:8,s:["Learn the signal words: total/sum/altogether → add; difference/left/more than → subtract; each/per/times → multiply; share/split/per person → divide.","Use the 4-step method: (1) Read and underline what is asked, (2) write what is given, (3) choose the operation, (4) solve and check the answer makes sense.","Do 5 word problems a day for 3 weeks."],m:"You can read a paragraph and turn it into a correct calculation.",r:L.arith}
 ]},
 {t:"✅ Stage 1 Checkpoint",topics:[
  {n:"Checkpoint: Mental Math Sprint",h:3,s:["50 mixed single-digit additions in under 3 minutes.","50 mixed single-digit subtractions in under 3 minutes.","Tables 2–12: 40 random questions in under 4 minutes.","5 multi-digit additions, 5 subtractions, 5 multiplications, 5 long divisions on paper — all correct.","Fail any part? Redo that topic. Arithmetic speed is what makes all future math feel easy."],m:"All five sprints passed.",r:L.prac}
 ]}
]},
/* ============================ STAGE 2 ============================ */
{id:2,emo:"🍕",t:"Stage 2 · Fractions, Decimals, Percentages",sub:"Numbers that are not whole — plus the math of real life",
 goal:"Fractions stop being scary. You can move freely between 1/2, 0.5 and 50%. You can handle discounts, interest, averages — actual daily-life math.",
 mods:[
 {t:"Decimals",topics:[
  {n:"Decimal place value (tenths, hundredths)",h:4,s:["A decimal is a fraction with a denominator of 10, 100, 1000. 0.7 = 7/10, 0.25 = 25/100.","Write the place-value columns: ones . tenths hundredths thousandths.","Read decimals aloud properly: 3.14 = 'three point one four'."],m:"You can explain exactly what each digit in 4.375 is worth.",r:L.arith},
  {n:"Comparing & rounding decimals",h:4,s:["Compare by adding zeros: 0.7 vs 0.65 → 0.70 vs 0.65, so 0.7 is bigger.","Round to 1, 2, 3 decimal places.","Order 6 decimals from smallest to largest."],m:"You never fall for '0.65 is bigger than 0.7 because 65 > 7'.",r:L.arith},
  {n:"Adding, subtracting, multiplying & dividing decimals",h:8,s:["Add/subtract: line up the decimal POINTS (not the last digits). Fill gaps with zeros.","Multiply: ignore decimals, multiply as whole numbers, then count total decimal places in the answer.","Divide: move the decimal in the divisor to make it a whole number, move it the same amount in the dividend.","Do 10 problems of each type daily for a week."],m:"All four operations with decimals, correct to 3 decimal places.",r:L.arith}
 ]},
 {t:"Fractions (the big one — do not rush)",topics:[
  {n:"What a fraction is: numerator & denominator",h:4,s:["Denominator = how many equal parts the whole is cut into. Numerator = how many parts you have.","Draw it: shade 3/8 of a rectangle, 2/5 of a circle.","Find fractions of real things: 1/2 of ₹100, 3/4 of an hour, 2/5 of 20."],m:"You can draw and explain any fraction, and find a fraction of a quantity.",r:L.arith},
  {n:"Equivalent fractions & simplifying",h:6,s:["Multiply or divide top AND bottom by the same number: 1/2 = 2/4 = 3/6 = 50/100.","Simplify to lowest terms by dividing by the HCF. 12/18 → divide by 6 → 2/3.","Simplify 25 fractions a day until it is automatic."],m:"You can generate equivalent fractions and always reduce to lowest terms.",r:L.arith},
  {n:"Proper, improper & mixed numbers",h:4,s:["Proper: top < bottom (3/4). Improper: top ≥ bottom (7/4). Mixed: 1¾.","Convert mixed → improper: 1¾ = (1×4+3)/4 = 7/4.","Convert improper → mixed by dividing: 7 ÷ 4 = 1 remainder 3 → 1¾."],m:"Conversion both ways is instant.",r:L.arith},
  {n:"Adding & subtracting fractions",h:8,s:["Same denominator: just add the tops. 2/7 + 3/7 = 5/7.","Different denominators: find the LCM, convert both to equivalent fractions with that denominator, then add.","Mixed numbers: convert to improper first, or handle whole parts separately.","ALWAYS simplify the final answer."],m:"You can add/subtract any two fractions and simplify the result.",r:L.arith},
  {n:"Multiplying & dividing fractions",h:6,s:["Multiply: straight across. (2/3) × (4/5) = 8/15. Cross-cancel first to keep numbers small.","Divide: keep–change–flip. (2/3) ÷ (4/5) = (2/3) × (5/4).","Reciprocal = flipped fraction. A number times its reciprocal = 1."],m:"Multiply and divide fractions fluently, including mixed numbers.",r:L.arith},
  {n:"Fraction ↔ decimal ↔ percent conversions",h:5,s:["Fraction → decimal: divide the top by the bottom (3/8 = 0.375).","Decimal → fraction: use place value (0.375 = 375/1000 = 3/8).","Memorise the common ones: 1/2=.5, 1/3=.333, 1/4=.25, 1/5=.2, 2/5=.4, 3/5=.6, 4/5=.8, 1/8=.125, 3/8=.375, 5/8=.625, 7/8=.875, 1/6=.1667, 1/9=.111, 1/10=.1."],m:"You convert between all three forms instantly.",r:L.arith}
 ]},
 {t:"Percentages, Ratio & Proportion",topics:[
  {n:"Percent means 'per hundred'",h:4,s:["50% = 50/100 = 1/2. Percent is just a fraction with denominator 100.","Convert: % → decimal (divide by 100), decimal → % (multiply by 100).","Shade 25%, 60%, 120% of a 10×10 grid."],m:"Percent ↔ fraction ↔ decimal is automatic.",r:L.arith},
  {n:"Finding a percent of a number",h:5,s:["20% of 150 = 0.2 × 150 = 30.","Learn the shortcuts: 10% = move the decimal one place. 1% = two places. 5% = half of 10%. 20% = double 10%.","Real practice: tips, taxes, exam scores, battery percentages."],m:"You find any common percent mentally.",r:L.arith},
  {n:"Percent increase, decrease & reverse percent",h:6,s:["Increase: new = old × (1 + r/100). A 20% increase means multiply by 1.2.","Decrease: multiply by (1 − r/100). A 15% discount means multiply by 0.85.","Reverse: 'After a 20% discount the price is ₹800 — what was the original?' → 800 ÷ 0.8 = ₹1000.","Careful: a 20% increase then a 20% decrease is NOT back to the start (1.2 × 0.8 = 0.96)."],m:"You handle percentage change forwards and backwards.",r:L.arith},
  {n:"Ratios & simplifying them",h:4,s:["A ratio compares quantities: 3 boys : 5 girls.","Simplify like a fraction: 12:18 = 2:3.","Divide a total in a given ratio: split ₹800 in 3:5 → parts = 8, so 3/8 × 800 = ₹300 and 5/8 × 800 = ₹500."],m:"You can split any quantity in a given ratio.",r:L.arith},
  {n:"Proportion, cross-multiplication & unit rate",h:6,s:["Two ratios are in proportion if a/b = c/d. Cross-multiply: a×d = b×c.","Solve: 4/7 = x/21 → x = 12.","Unit rate: 300 km in 5 hours = 60 km per hour. Always find 'per 1' first.","Scale and map problems: 1 cm on map = 5 km real → 7 cm = 35 km."],m:"You set up and solve proportion problems without confusion.",r:L.arith}
 ]},
 {t:"Powers & Roots",topics:[
  {n:"Exponents (powers)",h:5,s:["5³ = 5×5×5 = 125. The exponent counts how many times you multiply.","Memorise squares 1²–25² and cubes 1³–12³. This pays off for the rest of your life.","Learn the laws: aᵐ × aⁿ = aᵐ⁺ⁿ, aᵐ ÷ aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁰ = 1, a⁻ⁿ = 1/aⁿ."],m:"You know squares to 25² and cubes to 12³ cold, and use the exponent laws.",r:L.prealg},
  {n:"Square roots & cube roots",h:5,s:["√49 = 7 because 7×7 = 49. Roots undo powers.","Learn perfect squares to 400 and their roots.","Simplify surds: √50 = √(25×2) = 5√2.","Cube roots: ∛27 = 3. Estimating non-perfect roots (√30 is between 5 and 6, closer to 5.5)."],m:"You can find or estimate any square/cube root and simplify surds.",r:L.prealg}
 ]},
 {t:"Real-Life Math (why any of this matters)",topics:[
  {n:"Profit, loss, discount & GST",h:5,s:["Profit = Selling Price − Cost Price. Loss = CP − SP.","Profit% is always calculated on Cost Price.","Discount% is on Marked Price. GST is added on top.","Do 20 real shopping calculations this month."],m:"You can compute a shopkeeper's profit or your savings on a sale.",r:L.arith},
  {n:"Simple & compound interest",h:6,s:["Simple Interest: SI = P × R × T / 100. Amount = P + SI.","Compound Interest: A = P(1 + R/100)ⁿ. The interest earns interest.","Compare ₹10,000 at 8% for 3 years both ways and see the gap.","This is literally how your bank, loan and FD work."],m:"You can compute an EMI-ish scenario and explain why compound interest is powerful.",r:L.arith},
  {n:"Averages (mean) & basic data",h:5,s:["Mean = total sum ÷ number of items.","Worked example: marks 62, 75, 80, 55, 68 → sum 340 ÷ 5 = 68.","Understand how one huge value distorts an average.","Collect your own data (7 days of spending) and compute the mean."],m:"You can compute and interpret an average of real data.",r:L.stats},
  {n:"Reading tables, bar graphs & pie charts",h:4,s:["Read a bill, a marksheet, a train timetable.","Answer questions from a bar chart: which is largest, by how much, what is the total.","From a pie chart: if a slice is 25% and the total is ₹4000, that slice is ₹1000."],m:"You can extract numbers from any everyday chart.",r:L.stats}
 ]},
 {t:"✅ Stage 2 Checkpoint",topics:[
  {n:"Checkpoint: Fractions, Decimals, Percents",h:3,s:["Simplify 10 fractions to lowest terms.","Add/subtract/multiply/divide 5 fractions each, all correct.","Convert 10 values between fraction, decimal and percent.","Solve 5 percent word problems and 3 interest problems.","Under 90%? Redo the specific topic before moving on."],m:"90%+ on all four parts.",r:L.arith}
 ]}
]},
/* ============================ STAGE 3 ============================ */
{id:3,emo:"🔤",t:"Stage 3 · Pre-Algebra",sub:"The moment letters join the numbers",
 goal:"You stop fearing 'x'. Letters are just boxes for numbers. This stage is the bridge between arithmetic and real mathematics — it changes how you think.",
 mods:[
 {t:"Variables & Expressions",topics:[
  {n:"What a variable actually is",h:3,s:["A variable is a placeholder — an unknown number, or a number that can change.","If a pen costs ₹x, then 5 pens cost ₹5x. That is the whole idea.","Write expressions for real situations: your age in 5 years = a + 5."],m:"You can translate a sentence into an expression and back.",r:L.prealg},
  {n:"Writing & evaluating expressions",h:5,s:["Notation: 3 × y is written 3y. y × y is y². a ÷ b is a/b.","Substitute values: if x = 4 and y = 3, then 2x + 5y = 8 + 15 = 23.","Substitute negatives carefully: if x = −3, then x² = 9 but 2x = −6.","Evaluate 30 expressions with 2–3 variables."],m:"You substitute correctly, including with negatives.",r:L.prealg},
  {n:"Like terms & simplifying",h:5,s:["Like terms have the same variable AND same power: 3x and 7x are like; 3x and 3x² are not.","Add like terms: 5a + 2a = 7a. You can never add 5a + 2b.","Simplify: 3x + 4y − x + 2y = 2x + 6y."],m:"You simplify any linear expression in 20 seconds.",r:L.prealg},
  {n:"Distributive property & expanding",h:5,s:["a(b + c) = ab + ac. So 3(x + 4) = 3x + 12.","With negatives: −2(x − 5) = −2x + 10. Watch the signs!","Factorising is the reverse: 6x + 9 = 3(2x + 3)."],m:"You expand and factorise simple expressions without sign errors.",r:L.prealg}
 ]},
 {t:"Equations & Inequalities",topics:[
  {n:"One-step equations",h:4,s:["An equation is a balance scale. Whatever you do to one side, do to the other.","x + 7 = 15 → subtract 7 → x = 8. 3x = 21 → divide by 3 → x = 7.","Solve 40 one-step equations. Always substitute your answer back to check."],m:"You solve one-step equations and check them.",r:L.prealg},
  {n:"Two-step & multi-step equations",h:7,s:["Undo in reverse order of operations: first the add/subtract, then the multiply/divide.","2x + 5 = 17 → subtract 5 → 2x = 12 → x = 6.","With variables on both sides: 5x − 3 = 2x + 9 → collect x on one side, numbers on the other.","With brackets: 3(x − 2) = 12 → expand first."],m:"You solve any linear equation and check by substitution.",r:L.prealg},
  {n:"Inequalities & number lines",h:5,s:["< > ≤ ≥. Solve exactly like equations, EXCEPT: multiplying or dividing by a NEGATIVE flips the sign.","Graph the solution on a number line (open circle for < >, filled for ≤ ≥).","Solve and graph 20 inequalities."],m:"You solve inequalities and never forget the sign flip.",r:L.prealg},
  {n:"Translating word problems into equations",h:7,s:["Method: let x = the unknown → write the equation from the sentence → solve → answer in a full sentence.","'Twice a number plus 7 is 25' → 2x + 7 = 25 → x = 9.","Do 4 per day for 2 weeks: age problems, money problems, number problems."],m:"You can turn a paragraph into an equation on your first attempt.",r:L.prealg}
 ]},
 {t:"Number Theory & Integers",topics:[
  {n:"Prime numbers, composites & prime factorisation",h:5,s:["A prime has exactly 2 factors: 1 and itself. Learn primes under 50.","Factor tree: 60 = 2×2×3×5 = 2²×3×5.","Every number has one unique prime factorisation — this is a big deal in math."],m:"You can prime-factorise any number up to 1000.",r:L.prealg},
  {n:"HCF (GCF) and LCM",h:6,s:["HCF = biggest common factor. LCM = smallest common multiple.","Method 1: list factors/multiples. Method 2: use prime factorisation.","Trick: HCF × LCM = product of the two numbers.","Where it is used: simplifying fractions (HCF), adding fractions (LCM)."],m:"You find HCF and LCM of two or three numbers quickly.",r:L.prealg},
  {n:"Negative numbers & the number line",h:6,s:["Negatives are 'left of zero' — think debt, temperature below zero, going backwards.","Adding a negative = subtracting: 5 + (−3) = 2. Subtracting a negative = adding: 5 − (−3) = 8.","The sign rules for multiply/divide: same signs → positive, different signs → negative.","Drill 30 signed-number operations a day for 2 weeks. Most mistakes in all future math come from here."],m:"Signed arithmetic is flawless.",r:L.prealg},
  {n:"Absolute value",h:3,s:["|−7| = 7. Absolute value = distance from zero, always non-negative.","Solve |x| = 5 → x = 5 or x = −5.","|x − 3| = 4 → x = 7 or x = −1."],m:"You understand absolute value as distance and can solve simple equations with it.",r:L.prealg}
 ]},
 {t:"The Coordinate Plane",topics:[
  {n:"Plotting points (x, y)",h:4,s:["The plane has an x-axis (horizontal) and y-axis (vertical), crossing at the origin (0,0).","A point (3, −2) means go right 3, down 2.","Plot 20 points. Learn the four quadrants and their sign patterns."],m:"You plot and read coordinates instantly.",r:L.prealg},
  {n:"Tables, graphs & the idea of a linear relationship",h:5,s:["Make a table for y = 2x + 1 with x = −2 to 3, then plot the points.","Notice they form a straight line — that is what 'linear' means.","Explore with Desmos: type y = 2x + 1 and drag the numbers to see what changes."],m:"You can build a table, plot it, and recognise a straight-line pattern.",r:L.desmos}
 ]},
 {t:"✅ Stage 3 Checkpoint",topics:[
  {n:"Checkpoint: Pre-Algebra",h:3,s:["Simplify 10 expressions with like terms and brackets.","Solve 10 equations (including negatives and variables on both sides).","Solve and graph 5 inequalities.","Find HCF and LCM of 5 pairs.","20 signed-number operations, zero errors."],m:"90%+ overall.",r:L.prealg}
 ]}
]},
/* ============================ STAGE 4 ============================ */
{id:4,emo:"📈",t:"Stage 4 · Algebra I",sub:"Linear equations, quadratics, polynomials, functions",
 goal:"Full command of algebra. If Stage 3 taught you what x is, this stage teaches you what you can DO with it. This is the level that school boards and every entrance exam assume you have.",
 mods:[
 {t:"Linear Equations & Graphs",topics:[
  {n:"Solving linear equations (all types)",h:6,s:["Brackets, fractions (multiply through by the LCM to clear denominators), variables on both sides.","Always check by substituting your answer back.","Solve 40 equations across one week."],m:"Any linear equation in one variable, solved and verified.",r:L.alg1},
  {n:"Slope: rise over run",h:5,s:["Slope m = (y₂ − y₁)/(x₂ − y₁). It measures steepness and direction.","Positive slope goes up-right, negative goes down-right, zero is horizontal, undefined is vertical.","Compute the slope between 15 pairs of points."],m:"Slope from two points, or from a graph, instantly.",r:L.alg1},
  {n:"Forms of a line: slope-intercept, point-slope, standard",h:6,s:["y = mx + c (slope-intercept). c is where it crosses the y-axis.","y − y₁ = m(x − x₁) (point-slope) — use when you know a point and the slope.","ax + by = c (standard form).","Convert between all three forms — this is a key fluency."],m:"You can write a line's equation from any given information and convert between forms.",r:L.alg1},
  {n:"Graphing lines & intercepts",h:5,s:["Method 1: make a table of 3 values. Method 2: use slope and y-intercept. Method 3: use both intercepts.","x-intercept: set y = 0. y-intercept: set x = 0.","Parallel lines have equal slopes. Perpendicular lines have slopes that multiply to −1."],m:"You sketch any line accurately and identify parallel/perpendicular relationships.",r:L.desmos},
  {n:"Linear inequalities in two variables",h:4,s:["Graph the boundary line (dashed for < >, solid for ≤ ≥), then shade the correct side.","Test a point (0,0) to decide which side to shade.","Graph solutions of a system of inequalities — the overlapping region."],m:"You can graph and interpret inequality regions.",r:L.alg1},
  {n:"Systems of linear equations",h:9,s:["Three methods: substitution, elimination, graphing. Learn all three and know when each is fastest.","Substitution: solve one equation for a variable, plug into the other.","Elimination: add/subtract equations to cancel a variable.","Interpret the result: one solution (lines cross), no solution (parallel), infinite solutions (same line).","Do 20 systems."],m:"You solve any 2×2 system by two methods and interpret the outcome.",r:L.alg1},
  {n:"Word problems with systems",h:6,s:["Classic types: two numbers, ages, coins, mixture, speed/distance, cost of two items.","Method: define TWO variables, write TWO equations, solve, answer in words, check.","2 pens + 3 books = ₹250; 1 pen + 2 books = ₹150. Find each price."],m:"You can model a real two-unknown situation and solve it.",r:L.alg1}
 ]},
 {t:"Quadratics",topics:[
  {n:"Polynomials: vocabulary & operations",h:6,s:["Terms, coefficients, degree, constant. Monomial, binomial, trinomial.","Add/subtract by combining like terms. Multiply using FOIL: (x+3)(x+5) = x² + 8x + 15.","Special products: (a+b)² = a²+2ab+b², (a−b)² = a²−2ab+b², (a+b)(a−b) = a²−b².","Memorise those three identities — they appear everywhere forever."],m:"You expand any two polynomials and recall the three identities instantly.",r:L.alg1},
  {n:"Exponent rules (full set)",h:5,s:["aᵐaⁿ = aᵐ⁺ⁿ · aᵐ/aⁿ = aᵐ⁻ⁿ · (aᵐ)ⁿ = aᵐⁿ · (ab)ⁿ = aⁿbⁿ","Zero and negative: a⁰ = 1, a⁻ⁿ = 1/aⁿ.","Fractional exponents: a^(1/n) = ⁿ√a, a^(m/n) = (ⁿ√a)ᵐ.","Simplify 30 expressions using these rules."],m:"All exponent rules are fluent, including fractional exponents.",r:L.alg1},
  {n:"Factoring quadratics",h:10,s:["Step 0: always take out a common factor first.","Method 1: a²−b² difference of squares → (a−b)(a+b).","Method 2: x² + bx + c → find two numbers that multiply to c and add to b.","Method 3: splitting the middle term for ax² + bx + c.","Method 4: grouping.","Factor 30 quadratics. Check by expanding back."],m:"You factor any quadratic and can verify by expanding.",r:L.alg1},
  {n:"Solving quadratics: all four methods",h:10,s:["Method 1: factorise, then use the zero-product property (if AB = 0, then A = 0 or B = 0).","Method 2: take square roots (for x² = k type).","Method 3: completing the square — x² + 6x + 5 = 0 → (x+3)² = 4 → x = −1 or −5.","Method 4: the quadratic formula x = (−b ± √(b²−4ac)) / 2a. Memorise it for life.","Always check both roots in the original equation."],m:"You solve any quadratic and choose the fastest method.",r:L.alg1},
  {n:"The discriminant & nature of roots",h:5,s:["D = b² − 4ac. D > 0 → two distinct real roots. D = 0 → one repeated root. D < 0 → no real roots (complex).","Connect this to the graph: D tells you how many times the parabola crosses the x-axis.","Compute D for 15 quadratics and predict, then verify by graphing in Desmos."],m:"You can predict the roots before solving.",r:L.desmos},
  {n:"Graphing parabolas",h:6,s:["y = ax² + bx + c is a parabola. a > 0 opens up, a < 0 opens down.","Vertex at x = −b/(2a). The axis of symmetry passes through it.","Roots are the x-intercepts; c is the y-intercept.","Sketch 10 parabolas by hand, then verify in Desmos."],m:"You can sketch a parabola from its equation and read key features from a graph.",r:L.desmos},
  {n:"Quadratic word problems",h:6,s:["Typical: area of a rectangle, projectile height, product of consecutive numbers, speed problems.","Set up the equation, solve, then REJECT impossible answers (a length cannot be negative)."],m:"You model a real situation with a quadratic and interpret the roots.",r:L.alg1}
 ]},
 {t:"More Algebra Tools",topics:[
  {n:"Polynomial division & the remainder theorem",h:6,s:["Long division of polynomials, same idea as number long division.","Synthetic division as a fast shortcut.","Remainder theorem: divide f(x) by (x − a), the remainder is f(a).","Factor theorem: if f(a) = 0 then (x − a) is a factor."],m:"You divide polynomials and use both theorems.",r:L.alg1},
  {n:"Radical expressions: simplify & operate",h:6,s:["√18 = √(9×2) = 3√2. Pull out perfect squares.","Add/subtract only like radicals: 3√2 + 5√2 = 8√2.","Multiply: √3 × √5 = √15. Divide and rationalise the denominator: 1/√2 = √2/2.","Rationalise two-term denominators using the conjugate: 1/(3+√2)."],m:"You simplify and operate with surds confidently.",r:L.alg1},
  {n:"Rational expressions (algebraic fractions)",h:8,s:["Factorise top and bottom first, then cancel common FACTORS (not terms!).","Multiply: tops × tops, bottoms × bottoms. Divide: keep-change-flip.","Add/subtract: find a common denominator, exactly like numeric fractions.","Always state excluded values (denominator ≠ 0).","Solve rational equations by multiplying through by the LCD — and check for extraneous roots."],m:"You handle algebraic fractions including solving equations.",r:L.alg1}
 ]},
 {t:"Functions (the most important idea in modern math)",topics:[
  {n:"What a function is: domain, range, notation",h:6,s:["A function takes an input and gives exactly ONE output. f(x) means 'the output when the input is x'.","If f(x) = 2x + 3 then f(4) = 11.","Domain = allowed inputs. Range = possible outputs. Watch for division by zero and square roots of negatives.","Vertical line test on a graph: a function is never cut twice by a vertical line."],m:"You can state the domain and range of simple functions and evaluate f(a).",r:L.alg1},
  {n:"Types of functions & their graphs",h:7,s:["Linear (straight line), quadratic (parabola), cubic (S-curve), absolute value (V), square root (half-parabola), reciprocal 1/x (hyperbola).","Sketch each family by hand and memorise its shape.","Play with Desmos: type each one and change the coefficients."],m:"Given an equation you know the shape; given a shape you know the family.",r:L.desmos},
  {n:"Transformations of graphs",h:6,s:["f(x) + k shifts up; f(x) − k shifts down; f(x + k) shifts LEFT; f(x − k) shifts RIGHT.","a·f(x) stretches vertically; f(ax) compresses horizontally; −f(x) flips vertically.","Practise: describe the transformation from y = x² to y = 2(x − 3)² + 1."],m:"You can predict a graph's shape from its transformed equation.",r:L.desmos},
  {n:"Composite & inverse functions",h:7,s:["Composition: (f∘g)(x) = f(g(x)) — plug one function into the other.","Inverse f⁻¹ undoes f: if f(2) = 7 then f⁻¹(7) = 2.","Find it algebraically: swap x and y, solve for y. Graphically: reflect across y = x.","A function has an inverse only if it is one-to-one (horizontal line test)."],m:"You can compose functions and find inverses.",r:L.alg1},
  {n:"Piecewise functions",h:4,s:["Different rules on different intervals, e.g. f(x) = x² if x < 0, and 2x if x ≥ 0.","Evaluate carefully by checking which interval the input falls in.","Graph each piece separately."],m:"You evaluate and graph piecewise functions.",r:L.alg1}
 ]},
 {t:"Sequences & Series (a preview)",topics:[
  {n:"Arithmetic progressions (AP)",h:5,s:["Each term adds a fixed common difference d: 3, 7, 11, 15 …","nth term: aₙ = a + (n−1)d. Sum of n terms: Sₙ = n/2 × (2a + (n−1)d).","Real use: salary increments, stacking, seating rows."],m:"You find any term and any sum of an AP.",r:L.alg1},
  {n:"Geometric progressions (GP)",h:5,s:["Each term multiplies by a fixed ratio r: 2, 6, 18, 54 …","nth term: aₙ = a·r^(n−1). Sum: Sₙ = a(rⁿ − 1)/(r − 1). Infinite sum when |r| < 1: S = a/(1 − r).","Real use: compound interest, population growth, bouncing ball."],m:"You find terms and sums of a GP, including the infinite case.",r:L.alg1},
  {n:"Sigma notation & the binomial theorem (intro)",h:5,s:["Σ just means 'add these up'. Σ(i=1 to 5) i² = 1+4+9+16+25 = 55.","Pascal's triangle gives the binomial coefficients: 1 2 1, 1 3 3 1, 1 4 6 4 1.","(a+b)² = a²+2ab+b², (a+b)³ = a³+3a²b+3ab²+b³."],m:"You can read sigma notation and expand (a+b)ⁿ for small n.",r:L.alg1}
 ]},
 {t:"✅ Stage 4 Checkpoint",topics:[
  {n:"Checkpoint: Algebra I mastery test",h:4,s:["20 mixed problems: linear equations, systems, factoring, quadratic formula, simplifying radicals and rational expressions, function evaluation, inverse of a function.","Time limit: 60 minutes. Aim for 85%+.","Every mistake goes into your Error Log with the reason. Then redo those topics.","This checkpoint is the gate to Calculus. Do not skip it."],m:"85%+ on a 60-minute mixed algebra test.",r:L.alg1}
 ]}
]},
/* ============================ STAGE 5 ============================ */
{id:5,emo:"📐",t:"Stage 5 · Geometry",sub:"Shapes, proofs, area, volume, coordinate geometry",
 goal:"You learn to reason with pictures and to PROVE things — the first real taste of mathematical argument. Geometry also builds the spatial sense you need for trig, calculus and physics.",
 mods:[
 {t:"Foundations & Angles",topics:[
  {n:"Points, lines, rays, segments & planes",h:3,s:["Know the definitions and notation (line AB, ray AB, segment AB).","Parallel lines never meet; perpendicular lines meet at 90°.","Learn basic constructions with compass and ruler: bisect a segment, bisect an angle, draw a perpendicular."],m:"You use geometry vocabulary precisely and can do the basic constructions.",r:L.geo},
  {n:"Types of angles & pairs of angles",h:5,s:["Acute (<90°), right (=90°), obtuse (90–180°), straight (=180°), reflex (>180°).","Complementary = sum 90°. Supplementary = sum 180°. Vertically opposite angles are equal.","Adjacent angles on a straight line sum to 180°."],m:"You identify and compute all angle pairs.",r:L.geo},
  {n:"Angles in triangles & polygons",h:6,s:["Angles of any triangle sum to 180°. Prove it by drawing a line parallel to one side.","Exterior angle = sum of the two opposite interior angles.","Polygon interior angle sum = (n − 2) × 180°. Each angle of a regular polygon = that ÷ n.","Exterior angles of ANY polygon sum to 360°."],m:"You can find any missing angle in a triangle or polygon.",r:L.geo},
  {n:"Parallel lines cut by a transversal",h:5,s:["Corresponding angles are equal; alternate interior angles are equal; co-interior (allied) angles sum to 180°.","Use these to find unknown angles in complex diagrams.","This is also how you PROVE lines are parallel."],m:"You solve multi-line angle puzzles.",r:L.geo}
 ]},
 {t:"Triangles",topics:[
  {n:"Triangle types & properties",h:4,s:["By sides: equilateral (all equal, all angles 60°), isosceles (two equal, base angles equal), scalene.","By angles: acute, right, obtuse.","In any triangle: the largest side is opposite the largest angle; sum of any two sides > third side."],m:"You classify triangles and use their properties.",r:L.geo},
  {n:"The Pythagorean theorem",h:7,s:["In a right triangle: a² + b² = c² where c is the hypotenuse.","Learn Pythagorean triples: 3-4-5, 5-12-13, 8-15-17, 7-24-25 (and their multiples).","Converse: if a²+b² = c² the triangle IS right-angled.","Real uses: ladder against a wall, diagonal of a screen, distance between two points.","See a visual proof (the square-rearrangement one) — understanding beats memorising."],m:"You apply Pythagoras fluently and recognise triples instantly.",r:L.geo},
  {n:"Congruence of triangles (SSS, SAS, ASA, AAS, RHS)",h:7,s:["Congruent = same shape AND same size. Learn all 5 criteria and what each requires.","Write congruence statements with vertices in the correct matching order.","Then use 'CPCT' — corresponding parts of congruent triangles are equal — to prove other things equal.","Practise writing two-column proofs: Statement | Reason."],m:"You can prove two triangles congruent and justify each step.",r:L.geo},
  {n:"Introduction to geometric proof",h:8,s:["A proof is a chain of statements, each justified by a definition, a given fact, or a theorem.","Start with two-column proofs, then write paragraph proofs.","Prove classic results: base angles of an isosceles triangle are equal; diagonals of a parallelogram bisect each other.","Write 10 proofs. Getting stuck is normal — read the solution, then reproduce it from scratch the next day."],m:"You can write a complete, justified proof of a simple theorem.",r:L.geo}
 ]},
 {t:"Quadrilaterals, Circles & Measurement",topics:[
  {n:"Quadrilaterals & their properties",h:6,s:["Parallelogram: opposite sides equal and parallel, opposite angles equal, diagonals bisect each other.","Rectangle: parallelogram with 4 right angles, equal diagonals. Rhombus: all sides equal, diagonals bisect at 90°. Square: both. Trapezium: one pair of parallel sides. Kite: two pairs of adjacent equal sides.","Learn the family tree — every square is a rectangle, every rectangle is a parallelogram."],m:"You can state and use the properties of each quadrilateral.",r:L.geo},
  {n:"Circle vocabulary & theorems",h:9,s:["Radius, diameter, chord, arc, sector, segment, secant, tangent.","Key theorems: angle at centre = 2 × angle at circumference; angle in a semicircle = 90°; angles in the same segment are equal; tangent ⊥ radius at point of contact; two tangents from an external point are equal.","Circumference = 2πr. Area = πr². Arc length = (θ/360) × 2πr. Sector area = (θ/360) × πr²."],m:"You use the circle theorems to find unknown angles and lengths.",r:L.geo2},
  {n:"Perimeter & area of 2D shapes (including composites)",h:7,s:["Rectangle = l×b, square = s², triangle = ½×base×height, parallelogram = base×height, trapezium = ½(a+b)h, circle = πr².","Heron's formula for a triangle when you know all three sides.","Composite shapes: split into simple ones, add the areas. Shaded-region problems: subtract."],m:"Any area problem, including composites and shaded regions.",r:L.geo},
  {n:"Surface area & volume of 3D solids",h:9,s:["Cuboid, cube, cylinder, cone, sphere, prism, pyramid.","Volume: cuboid = lwh, cylinder = πr²h, cone = ⅓πr²h, sphere = 4/3πr³, pyramid = ⅓ × base area × height.","Surface area: sum the faces. Cylinder = 2πrh + 2πr². Sphere = 4πr².","Derive the cone and pyramid ⅓ factor by filling and pouring — do the experiment with water."],m:"You compute volume and surface area of all standard solids.",r:L.geo},
  {n:"Similarity & scale factor",h:7,s:["Similar = same shape, different size. Corresponding angles equal, sides in proportion.","Criteria: AA, SSS, SAS.","Ratio of areas = (scale factor)². Ratio of volumes = (scale factor)³.","Uses: maps, models, shadows, enlarging photos."],m:"You solve similarity problems including area/volume ratios.",r:L.geo}
 ]},
 {t:"Coordinate Geometry",topics:[
  {n:"Distance & midpoint formulas",h:5,s:["Distance = √((x₂−x₁)² + (y₂−y₁)²) — this is just Pythagoras on the plane.","Midpoint = ((x₁+x₂)/2, (y₁+y₂)/2).","Practise with 15 pairs of points and verify by sketching."],m:"Both formulas are automatic.",r:L.geo},
  {n:"Section formula, slope & area of a triangle",h:6,s:["A point dividing a segment in ratio m:n (internal and external).","Slope from coordinates; conditions for parallel and perpendicular lines.","Area of triangle with vertices (x₁,y₁),(x₂,y₂),(x₃,y₃) = ½|x₁(y₂−y₃)+x₂(y₃−y₁)+x₃(y₁−y₂)|.","Condition for three points to be collinear: area = 0."],m:"You solve coordinate geometry problems without needing a diagram.",r:L.geo},
  {n:"Equation of a line & intro to conics",h:7,s:["All forms again, now used in geometry problems: line through two points, through a point with a given slope.","Distance from a point to a line. Angle between two lines.","Intro to conics: circle (x−h)² + (y−k)² = r². Recognise parabola, ellipse, hyperbola equations by sight."],m:"You work with lines and circles algebraically.",r:L.desmos}
 ]},
 {t:"✅ Stage 5 Checkpoint",topics:[
  {n:"Checkpoint: Geometry",h:3,s:["10 angle-finding problems (triangles, parallel lines, circles).","5 area/volume problems including one composite and one 3D solid.","3 similarity problems.","2 formal proofs written out fully with reasons.","2 coordinate geometry problems."],m:"85%+, and your proofs have proper justifications.",r:L.geo}
 ]}
]},
/* ============================ STAGE 6 ============================ */
{id:6,emo:"📊",t:"Stage 6 · Trigonometry",sub:"Ratios, the unit circle, identities, graphs",
 goal:"Trig is just similar right triangles, generalised to a circle. Once the unit circle clicks, the whole subject becomes one picture instead of 50 formulas.",
 mods:[
 {t:"Right-Triangle Trigonometry",topics:[
  {n:"SOH CAH TOA: sin, cos, tan",h:6,s:["In a right triangle with angle θ: sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse, tan θ = opposite/adjacent.","Also learn the reciprocals: cosec, sec, cot.","Label the triangle FIRST in every problem (opposite/adjacent relative to the angle you care about).","Solve 20 problems finding a missing side or angle."],m:"You set up the correct ratio every time.",r:L.trig},
  {n:"Special angles 30°, 45°, 60°",h:6,s:["Derive them from two triangles: half a square (45-45-90) and half an equilateral triangle (30-60-90).","Side ratios: 45-45-90 is 1:1:√2. 30-60-90 is 1:√3:2.","Memorise the table: sin30=1/2, sin45=√2/2, sin60=√3/2, and the matching cos and tan values.","Recite the table forwards and backwards until instant."],m:"Special-angle values recalled instantly, no calculator.",r:L.trig},
  {n:"Angles of elevation & depression",h:6,s:["Elevation = looking up from horizontal. Depression = looking down from horizontal.","Draw the right triangle, mark the angle, label known and unknown sides.","Classic problems: height of a tower, length of a ladder, distance to a ship, shadow of a pole."],m:"You solve real height-and-distance problems.",r:L.trig}
 ]},
 {t:"The Unit Circle & Radians",topics:[
  {n:"Radians & degree conversion",h:5,s:["π radians = 180°. So multiply degrees by π/180 to get radians, and by 180/π the other way.","A radian is the angle where arc length equals radius — this is why calculus uses radians.","Common values: 30°=π/6, 45°=π/4, 60°=π/3, 90°=π/2, 180°=π, 270°=3π/2, 360°=2π."],m:"Convert both ways instantly.",r:L.trig},
  {n:"The unit circle (the single most valuable diagram in trig)",h:10,s:["A circle of radius 1 at the origin. Any point on it is (cos θ, sin θ). That is the whole idea.","Learn the four quadrants and the sign rule: All-Sin-Tan-Cos (which functions are positive where).","Learn reference angles: any angle reduces to an acute one.","Draw a blank unit circle from memory and fill in coordinates — do this daily for 3 weeks.","Then extend to angles beyond 360° and negative angles."],m:"You can reproduce the full unit circle from memory and evaluate trig functions of any angle.",r:L.trig},
  {n:"Trig functions of any angle & periodicity",h:6,s:["sin and cos have period 2π (they repeat every 360°). tan has period π.","Values at quadrantal angles (0, 90, 180, 270) — note tan 90° is undefined.","Cast rule for signs. Evaluate things like sin 210°, cos(−60°), tan 405° without a calculator."],m:"Any angle, any quadrant, correct sign and value.",r:L.trig}
 ]},
 {t:"Graphs & Identities",topics:[
  {n:"Graphing sin, cos, tan",h:7,s:["Build tables of values, plot, and recognise the wave shape.","Amplitude (height), period (width of one cycle), phase shift (horizontal slide), vertical shift.","Sketch y = 3 sin(2x + π/2) − 1 by identifying all four features.","Note tan's vertical asymptotes at odd multiples of 90°."],m:"You sketch any transformed trig graph and read features off a graph.",r:L.desmos},
  {n:"Fundamental identities",h:8,s:["Reciprocal: sin·cosec = 1, cos·sec = 1, tan·cot = 1.","Quotient: tan = sin/cos, cot = cos/sin.","Pythagorean: sin²θ + cos²θ = 1 → also 1 + tan²θ = sec²θ and 1 + cot²θ = cosec²θ.","Practice: simplify expressions and prove simple identities."],m:"You recall all 8 fundamental identities and use them to simplify.",r:L.trig},
  {n:"Compound angle, double & half angle formulas",h:9,s:["sin(A±B) = sinA cosB ± cosA sinB; cos(A±B) = cosA cosB ∓ sinA sinB; tan(A±B) formula.","Double angle: sin2A = 2 sinA cosA; cos2A = cos²A − sin²A = 1 − 2sin²A = 2cos²A − 1.","Half angle and product-to-sum formulas.","Derive the double-angle ones from the compound-angle ones (do it yourself once — you will never forget them)."],m:"You can derive and apply the compound and double angle formulas.",r:L.trig},
  {n:"Solving trigonometric equations",h:8,s:["Solve sin x = 1/2 → x = 30° and 150°, plus every full rotation: x = 30° + 360°k or 150° + 360°k.","General solutions matter — trig equations have infinitely many answers.","Use identities first to turn the equation into a basic one, then factorise.","Solve within a given interval (e.g. 0 ≤ x ≤ 2π)."],m:"You find all solutions in a given interval.",r:L.trig}
 ]},
 {t:"Beyond Right Triangles",topics:[
  {n:"Law of Sines & Law of Cosines",h:8,s:["Law of Sines: a/sinA = b/sinB = c/sinC. Use when you have an angle and its opposite side.","Law of Cosines: c² = a² + b² − 2ab·cosC. Use with SAS or SSS. (It reduces to Pythagoras when C = 90°.)","Know which law to use from the information given — make yourself a decision table."],m:"You solve any non-right triangle.",r:L.trig},
  {n:"Area of a triangle & applications",h:5,s:["Area = ½ ab sinC (two sides and the included angle).","Heron's formula as an alternative.","Applications: surveying, navigation, bearings, forces in physics."],m:"You compute triangle area from sides and angles.",r:L.trig},
  {n:"Inverse trig functions",h:7,s:["sin⁻¹, cos⁻¹, tan⁻¹ answer 'which angle gives this ratio?'.","They need restricted domains to be functions: sin⁻¹ on [−π/2, π/2], cos⁻¹ on [0, π], tan⁻¹ on (−π/2, π/2).","Know the principal values and how to find other solutions from them."],m:"You evaluate inverse trig values and understand the domain restrictions.",r:L.trig},
  {n:"Trig in vectors & complex numbers (bridge topic)",h:5,s:["A vector with magnitude r at angle θ has components (r cos θ, r sin θ).","Complex numbers: z = r(cos θ + i sin θ). This is Euler's formula in disguise.","See how trig connects algebra and geometry."],m:"You resolve vectors into components using trig.",r:L.trig}
 ]},
 {t:"✅ Stage 6 Checkpoint",topics:[
  {n:"Checkpoint: Trigonometry",h:3,s:["Fill in a blank unit circle (all coordinates, degrees and radians) in under 5 minutes.","Evaluate 10 trig expressions without a calculator.","Simplify 3 expressions using identities.","Solve 3 trig equations giving all solutions in [0, 2π).","Solve 2 non-right triangle problems."],m:"All five parts passed.",r:L.trig}
 ]}
]},
/* ============================ STAGE 7 ============================ */
{id:7,emo:"🎢",t:"Stage 7 · Pre-Calculus",sub:"Advanced functions, logs, complex numbers, vectors",
 goal:"You build the exact toolkit calculus needs. Skipping this is the #1 reason people find calculus hard. Do it properly and calculus becomes almost pleasant.",
 mods:[
 {t:"Advanced Functions",topics:[
  {n:"Polynomial & rational functions in depth",h:9,s:["Degree, leading coefficient → end behaviour (what the graph does far to the left and right).","Roots/zeros and their multiplicity: odd multiplicity crosses the axis, even multiplicity bounces off it.","Rational functions: vertical asymptotes (denominator zero), horizontal asymptotes (compare degrees), holes (common factors).","Sketch 15 functions by hand, then check with Desmos."],m:"You can sketch a polynomial or rational function from its equation.",r:L.precalc},
  {n:"Exponential functions",h:7,s:["f(x) = a·bˣ. Growth when b > 1, decay when 0 < b < 1.","The special base e ≈ 2.71828 — the natural growth constant.","Key features: always positive, horizontal asymptote at y = 0, passes through (0, a).","Model real growth: population, bacteria, compound interest, radioactive decay."],m:"You graph and model exponential growth/decay.",r:L.precalc},
  {n:"Logarithms",h:10,s:["A log is just an exponent in disguise: log_b(x) = y means bʸ = x. This sentence is the whole topic.","log₁₀ is 'log', logₑ is 'ln'.","Laws: log(xy) = log x + log y · log(x/y) = log x − log y · log(xⁿ) = n log x · change of base formula.","Solve exponential equations by taking logs: 3ˣ = 20 → x = ln20/ln3.","Real world: pH, decibels, earthquake magnitude, algorithm complexity."],m:"You convert between log and exponential form and solve equations with logs.",r:L.precalc},
  {n:"Complex numbers",h:8,s:["i = √(−1), so i² = −1, i³ = −i, i⁴ = 1 (cycles every 4).","Add/subtract like binomials. Multiply using FOIL then replace i² with −1.","Divide by multiplying top and bottom by the conjugate.","Modulus |a + bi| = √(a²+b²). Argument = angle. Polar form and De Moivre's theorem.","Plot complex numbers on the Argand plane."],m:"Full arithmetic with complex numbers including polar form.",r:L.precalc}
 ]},
 {t:"Geometry of Pre-Calculus",topics:[
  {n:"Vectors",h:9,s:["A vector has magnitude and direction. Written as components ⟨x, y⟩ or with i, j notation.","Add component-wise. Magnitude = √(x²+y²). Direction angle = tan⁻¹(y/x).","Scalar multiplication. Unit vectors.","Dot product: a·b = |a||b|cosθ = x₁x₂ + y₁y₂. Used to find angles and test perpendicularity (dot = 0).","Projections, and cross product in 3D."],m:"You do full vector arithmetic and use dot products.",r:L.precalc},
  {n:"Parametric equations",h:6,s:["x and y are both written in terms of a third variable t (often time).","Example: x = 3cos t, y = 3sin t traces a circle.","Eliminate t to get a Cartesian equation; convert the other way too.","Applications: projectile motion, circular motion."],m:"You graph parametric equations and convert to/from Cartesian form.",r:L.precalc},
  {n:"Polar coordinates",h:7,s:["A point is (r, θ) — distance from origin and angle, instead of (x, y).","Convert: x = r cos θ, y = r sin θ, r² = x² + y², tan θ = y/x.","Graph polar curves: circles, cardioids, roses, spirals.","This makes circular and spiral problems dramatically easier."],m:"You convert between coordinate systems and sketch polar curves.",r:L.desmos},
  {n:"Conic sections",h:8,s:["All four are slices of a cone: circle, ellipse, parabola, hyperbola.","Standard forms and their features: centre, vertices, foci, axes, asymptotes, eccentricity.","Parabola: focus and directrix. Ellipse: sum of distances to foci is constant. Hyperbola: difference is constant.","Identify a conic from its general equation; complete the square to get standard form."],m:"You recognise, graph and analyse all four conics.",r:L.desmos}
 ]},
 {t:"Final Preparation",topics:[
  {n:"Sequences, series & the binomial theorem (full)",h:8,s:["Arithmetic and geometric series with all their formulas (revise from Stage 4).","Infinite geometric series and convergence condition |r| < 1.","Sigma notation fluency, telescoping series.","Binomial theorem with combinations: (a+b)ⁿ = Σ C(n,k) aⁿ⁻ᵏ bᵏ. Pascal's triangle."],m:"You handle series and binomial expansions confidently.",r:L.precalc},
  {n:"The idea of a limit (informal preview)",h:5,s:["Ask: what value does f(x) get closer and closer to as x approaches a number?","Explore 1/x as x grows, and (x²−1)/(x−1) as x → 1.","Use a table of values and a graph. Do not worry about rigor yet.","This is the doorway to calculus — walk through it curious, not scared."],m:"You have an intuitive feel for 'approaching' a value.",r:L.precalc},
  {n:"Algebra survival refresher",h:6,s:["Redo your Error Log from Stages 3–6. Every mistake you ever made is listed there.","Timed drills: factoring, exponent rules, log laws, fraction manipulation, solving equations.","Weak algebra is the reason calculus feels impossible. Fix it here, not later."],m:"Your algebra is fast and reliable under time pressure.",r:L.alg1}
 ]},
 {t:"✅ Stage 7 Checkpoint",topics:[
  {n:"Checkpoint: Ready for Calculus?",h:4,s:["Simplify 10 log/exp expressions and solve 5 equations involving them.","Do 5 complex number operations.","5 vector problems including a dot product.","Sketch 2 rational functions with asymptotes.","2 conic identification problems.","Score below 85%? Fix it now — calculus will be ten times harder otherwise."],m:"85%+ and no algebraic hesitation.",r:L.precalc}
 ]}
]}
];
