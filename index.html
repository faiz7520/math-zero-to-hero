STAGES.push(
/* ============================ STAGE 8 ============================ */
{id:8,emo:"∫",t:"Stage 8 · Calculus I",sub:"Limits, derivatives and what they mean",
 goal:"Calculus is the mathematics of CHANGE. A derivative is a rate of change; an integral is an accumulation. Once you see those two pictures, the formulas stop being magic.",
 mods:[
 {t:"Limits & Continuity",topics:[
  {n:"The idea of a limit",h:5,s:["A limit asks: what value does f(x) approach as x gets close to a — NOT what f(a) actually is.","Explore numerically (make a table) and graphically.","Understand when a limit fails to exist (jump, blow-up, oscillation)."],m:"You can state a limit from a table and from a graph.",r:L.calc},
  {n:"Limit laws & evaluating limits algebraically",h:9,s:["Laws: sum, difference, product, quotient, constant multiple, power of limits.","Direct substitution first. If you get 0/0 (indeterminate), factorise, cancel, then substitute.","For square roots, multiply by the conjugate. For fractions, multiply by the LCD.","Infinite limits: divide by the highest power of x.","Do 30 limit problems — this is pure algebra practice in disguise."],m:"You evaluate limits reliably using the right technique.",r:L.calc},
  {n:"One-sided limits, infinite limits & asymptotes",h:6,s:["lim x→a⁻ and lim x→a⁺. The two-sided limit exists only if they are equal.","Limits that go to ±∞ → vertical asymptotes.","Limits at infinity → horizontal asymptotes."],m:"You connect limit behaviour directly to asymptotes on a graph.",r:L.calc},
  {n:"The formal (epsilon–delta) definition",h:6,s:["For every ε > 0 there exists δ > 0 such that 0 < |x − a| < δ implies |f(x) − L| < ε.","Translate it into plain English: 'however close you demand f(x) be to L, I can force it by keeping x close enough to a'.","Work through 3–4 proofs (linear functions first, then a quadratic).","Do not panic here. Understanding it once is enough at this stage."],m:"You can read and follow an epsilon–delta proof.",r:L.calc},
  {n:"Continuity & the Intermediate Value Theorem",h:6,s:["f is continuous at a if lim x→a f(x) = f(a). Three conditions to check.","Types of discontinuity: removable (hole), jump, infinite.","Continuous on a closed interval → IVT: if f(a) and f(b) have opposite signs, f crosses zero somewhere between.","Use IVT to prove an equation has a root in an interval."],m:"You test continuity and apply IVT.",r:L.calc}
 ]},
 {t:"Derivatives",topics:[
  {n:"The derivative as a limit & as a slope",h:8,s:["Definition: f′(x) = lim h→0 [f(x+h) − f(x)] / h.","Meaning: the slope of the tangent line, the instantaneous rate of change.","Derive from scratch: x², x³, 1/x, √x. Do these by hand at least once.","Average rate of change vs instantaneous rate of change."],m:"You can compute a derivative from the limit definition.",r:L.calc},
  {n:"Differentiation rules",h:10,s:["Constant, power rule (d/dx xⁿ = n xⁿ⁻¹), constant multiple, sum/difference.","Product rule: (uv)′ = u′v + uv′.","Quotient rule: (u/v)′ = (u′v − uv′)/v².","Differentiability implies continuity, but not the reverse (|x| at 0 is the classic counterexample).","Drill 40 problems until the rules are reflex."],m:"You differentiate any combination of polynomials and rational functions.",r:L.calc},
  {n:"Derivatives of trig, exp & log functions",h:9,s:["d/dx sin x = cos x; d/dx cos x = −sin x; d/dx tan x = sec²x (memorise the full set).","d/dx eˣ = eˣ — the function that is its own derivative. d/dx aˣ = aˣ ln a.","d/dx ln x = 1/x; d/dx log_b x = 1/(x ln b).","Derivatives of inverse trig functions."],m:"All standard derivatives are memorised.",r:L.calc},
  {n:"The chain rule (the most-used rule in calculus)",h:10,s:["d/dx f(g(x)) = f′(g(x)) · g′(x). 'Derivative of the outside times derivative of the inside'.","Identify the outer and inner function every time before differentiating.","Examples: sin(3x²), e^(5x), ln(x²+1), (2x+7)¹⁰.","Combine with product and quotient rules. Do 40 problems."],m:"The chain rule is automatic, even nested twice.",r:L.calc},
  {n:"Implicit differentiation & related setup",h:7,s:["When y cannot be isolated (x² + y² = 25), differentiate both sides with respect to x, treating y as a function of y(x) — so every y-term gets a dy/dx.","Then solve for dy/dx.","Derivatives of inverse functions follow from this."],m:"You differentiate implicitly and find dy/dx.",r:L.calc},
  {n:"Higher-order derivatives",h:4,s:["f″, f‴ — the second derivative measures how the rate of change itself changes.","Physical meaning: position → velocity → acceleration."," nth derivative patterns for eˣ, sin x, xⁿ."],m:"You compute and interpret higher derivatives.",r:L.calc}
 ]},
 {t:"Applications of Derivatives",topics:[
  {n:"Tangent & normal lines, linear approximation",h:6,s:["Tangent line at x = a: y − f(a) = f′(a)(x − a). Normal line is perpendicular.","Linear approximation: f(x) ≈ f(a) + f′(a)(x − a) for x near a.","Differentials dy = f′(x) dx and error estimation."],m:"You write tangent lines and use linear approximation.",r:L.calc},
  {n:"Related rates",h:9,s:["Method: (1) draw and label, (2) list what changes with time, (3) write an equation linking the quantities, (4) differentiate with respect to t, (5) substitute known values LAST.","Classic problems: ladder sliding, water filling a cone, shadow lengthening, two cars separating, inflating balloon.","Do 15 of these. They all follow the same five steps."],m:"You solve related-rate problems systematically.",r:L.calc},
  {n:"Critical points, extrema & curve sketching",h:10,s:["Critical points: where f′ = 0 or f′ is undefined.","First derivative test: sign of f′ tells increasing/decreasing → local max/min.","Second derivative test: f″ > 0 → local min, f″ < 0 → local max. Concavity and inflection points where f″ changes sign.","Absolute extrema on a closed interval: check critical points AND endpoints.","Asymptotes + intercepts + critical points + concavity = a full sketch."],m:"You can sketch any function completely using calculus.",r:L.desmos},
  {n:"Optimization problems",h:10,s:["Method: (1) identify what to maximise/minimise, (2) write it as one variable using a constraint, (3) differentiate, (4) set to zero, (5) verify it is a max/min, (6) answer the actual question asked.","Classics: largest area with fixed fence, cheapest can of given volume, closest point on a curve, maximum revenue.","Do 12 problems. The setup is always the hard part, not the calculus."],m:"You solve real optimization problems end to end.",r:L.calc},
  {n:"Mean Value Theorem & Rolle's Theorem",h:6,s:["Rolle: if f(a) = f(b) and f is continuous/differentiable, some c has f′(c) = 0.","MVT: some c has f′(c) = (f(b) − f(a))/(b − a) — the tangent parallel to the secant.","Geometric intuition first, then use it to prove things (e.g. why a positive derivative means increasing)."],m:"You state, visualise and apply both theorems.",r:L.calc},
  {n:"L'Hôpital's Rule",h:5,s:["For 0/0 or ∞/∞ forms: lim f/g = lim f′/g′.","Rearrange other indeterminate forms (0·∞, ∞−∞, 1^∞, 0⁰) into a fraction first.","Check the form BEFORE applying — using it on a determinate form gives wrong answers."],m:"You apply L'Hôpital correctly and know its limits.",r:L.calc}
 ]},
 {t:"Integration (the first half)",topics:[
  {n:"Antiderivatives & indefinite integrals",h:7,s:["Integration is differentiation backwards. ∫2x dx = x² + C. Never forget + C.","Basic rules: ∫xⁿ dx = xⁿ⁺¹/(n+1) + C (n ≠ −1), ∫1/x dx = ln|x| + C, ∫eˣ dx = eˣ + C.","All the trig antiderivatives.","Always check your answer by differentiating it."],m:"Standard antiderivatives are memorised and verified.",r:L.calc},
  {n:"Riemann sums & the definite integral",h:9,s:["Area under a curve ≈ sum of thin rectangles. More rectangles → better approximation.","Left, right, midpoint sums. Compute them by hand for a simple function.","The definite integral is the limit of those sums as width → 0.","Signed area: below the x-axis counts as negative."],m:"You understand a definite integral as a limit of sums.",r:L.calc},
  {n:"The Fundamental Theorem of Calculus",h:8,s:["Part 1: d/dx ∫[a to x] f(t) dt = f(x). Integration and differentiation are inverse operations.","Part 2: ∫[a to b] f(x) dx = F(b) − F(a) where F is any antiderivative.","This theorem is why calculus is one subject and not two. Understand it deeply.","Practise FTC Part 1 with a variable upper limit and the chain rule."],m:"You can state and use both parts of the FTC.",r:L.calc},
  {n:"u-substitution",h:9,s:["The reverse chain rule. Pick u = the inner function, compute du, replace everything.","For definite integrals, change the LIMITS too (or convert back at the end).","Recognising the right u is a skill built by doing 50 problems.","Watch for constants you need to multiply or divide by."],m:"You solve integrals by substitution confidently.",r:L.calc}
 ]},
 {t:"✅ Stage 8 Checkpoint",topics:[
  {n:"Checkpoint: Calculus I",h:4,s:["Evaluate 10 limits (including one epsilon–delta reasoning question).","Differentiate 15 functions using product/quotient/chain rules.","5 related-rate or optimization problems, full working shown.","2 complete curve sketches.","10 integrals, including 4 by substitution.","Target 85%+. Calculus II builds directly on every one of these."],m:"85%+ across all sections.",r:L.calc}
 ]}
]},
/* ============================ STAGE 9 ============================ */
{id:9,emo:"🌀",t:"Stage 9 · Calculus II",sub:"Integration techniques, sequences, series, parametrics",
 goal:"The hardest computational stage for most people. The trick: techniques of integration are pattern recognition, and series are about one question — does it add up to a finite number?",
 mods:[
 {t:"Techniques of Integration",topics:[
  {n:"Integration by parts",h:9,s:["∫u dv = uv − ∫v du. It is the reverse product rule.","Choose u with LIATE: Logarithmic, Inverse trig, Algebraic, Trig, Exponential.","Repeated by parts, and the special case where the integral reappears (solve algebraically for it).","Classic examples: ∫x eˣ dx, ∫x² sin x dx, ∫ln x dx, ∫eˣ sin x dx."],m:"You apply by parts including the recursive case.",r:L.calc2},
  {n:"Trigonometric integrals",h:8,s:["Powers of sin and cos: use sin²+cos² = 1 and the half-angle identities to reduce powers.","Odd power → save one factor and substitute. Even power → half-angle formulas.","Products of sin/cos with different arguments → product-to-sum formulas.","Integrals of tan, sec, cot, csc — memorise the standard results."],m:"You handle all standard trig integrals.",r:L.calc2},
  {n:"Trigonometric substitution",h:7,s:["For √(a²−x²) use x = a sin θ; for √(a²+x²) use x = a tan θ; for √(x²−a²) use x = a sec θ.","Draw the reference triangle to convert back at the end.","Practise the three standard forms until the substitution is obvious."],m:"You recognise and execute trig substitution.",r:L.calc2},
  {n:"Partial fractions",h:9,s:["For rational functions: factorise the denominator, split into simpler fractions, solve for constants.","Cases: distinct linear, repeated linear, irreducible quadratic factors.","Then integrate each piece (usually gives logs and arctans).","Long division first if the top degree ≥ bottom degree."],m:"You decompose and integrate any rational function.",r:L.calc2},
  {n:"Improper integrals",h:8,s:["Infinite limits of integration, or infinite discontinuities inside the interval.","Rewrite as a limit: ∫[1,∞) 1/x² dx = lim b→∞ ∫[1,b] 1/x² dx.","Compare p-integrals: ∫1/xᵖ converges if p > 1.","Split at the problem point when the discontinuity is interior."],m:"You evaluate improper integrals and decide convergence.",r:L.calc2}
 ]},
 {t:"Applications of Integration",topics:[
  {n:"Area between curves",h:6,s:["∫(top − bottom) dx, or ∫(right − left) dy.","Find intersection points first to set the limits.","Sometimes you must split the region into pieces."],m:"You compute areas between any two curves.",r:L.desmos},
  {n:"Volumes: disks, washers & shells",h:10,s:["Disk: V = π∫[f(x)]² dx — rotating a region with no hole.","Washer: V = π∫(R² − r²) dx — rotating with a hole.","Shell: V = 2π∫ x·f(x) dx — often easier when rotating around the y-axis.","Know when to use which. Visualise the slice before writing anything."],m:"You find volumes of revolution by all three methods.",r:L.desmos},
  {n:"Arc length & surface area",h:6,s:["Arc length: L = ∫√(1 + (dy/dx)²) dx. Parametric and polar versions too.","Surface area of revolution: S = 2π∫ y √(1+(y′)²) dx.","These integrals are often messy — practise setting them up even when evaluating is hard."],m:"You set up arc length and surface area integrals correctly.",r:L.calc2},
  {n:"Physics & real-world applications",h:8,s:["Work = ∫F dx. Variable force, springs (Hooke's law), pumping water out of a tank.","Centre of mass and centroids: x̄ = ∫x·ρ dA / ∫ρ dA.","Fluid pressure and force on a submerged plate.","Average value of a function: (1/(b−a))∫f dx."],m:"You model a physical situation as an integral.",r:L.calc2},
  {n:"Probability applications of integrals",h:6,s:["Continuous random variables: total probability = 1 → ∫f(x)dx = 1.","Expected value = ∫x f(x) dx.","Normal distribution as the classic example. Sets up Stage 10 nicely."],m:"You use integrals for continuous probability.",r:L.stats}
 ]},
 {t:"Sequences & Series",topics:[
  {n:"Sequences & their convergence",h:6,s:["A sequence is an ordered list; a series is a sum.","Limit of a sequence. Monotone + bounded → convergent.","Squeeze theorem for sequences. L'Hôpital can help find sequence limits."],m:"You determine whether a sequence converges and to what.",r:L.calc2},
  {n:"Infinite series & the convergence question",h:7,s:["Partial sums Sₙ. The series converges if Sₙ has a finite limit.","Geometric series Σ arⁿ converges to a/(1−r) when |r| < 1. Learn this cold.","Telescoping series: most terms cancel.","Divergence test: if the terms do not go to 0, the series diverges (but going to 0 does NOT guarantee convergence — 1/n is the counterexample)."],m:"You handle geometric and telescoping series and use the divergence test.",r:L.calc2},
  {n:"Convergence tests (the toolkit)",h:12,s:["Integral test, p-series (Σ1/nᵖ converges iff p > 1).","Comparison and limit comparison tests.","Alternating series test and absolute vs conditional convergence.","Ratio test and root test — your go-to for factorials and nth powers.","Build a decision flowchart: which test do I try first? Do this yourself on one page."],m:"Given any series you can choose a test and reach the right conclusion.",r:L.calc2},
  {n:"Power series & radius of convergence",h:9,s:["Σ cₙ(x−a)ⁿ — a series with x in it. It converges for x in some interval around a.","Find the radius with the ratio test, then check the endpoints separately.","Differentiate and integrate power series term by term inside the radius."],m:"You find radius and interval of convergence.",r:L.calc2},
  {n:"Taylor & Maclaurin series",h:10,s:["f(x) = Σ f⁽ⁿ⁾(a)/n! · (x−a)ⁿ. A polynomial that mimics a function near a point.","Memorise the Maclaurin series for eˣ, sin x, cos x, 1/(1−x), ln(1+x).","Build them by hand for eˣ and sin x once — you will never forget them.","Taylor's theorem with remainder, and using series for approximation."],m:"You derive and use Taylor series for the standard functions.",r:L.calc2}
 ]},
 {t:"Parametric & Polar Calculus",topics:[
  {n:"Calculus with parametric curves",h:6,s:["dy/dx = (dy/dt)/(dx/dt). Second derivatives need care.","Arc length and area for parametric curves."],m:"You differentiate and integrate parametric curves.",r:L.calc2},
  {n:"Calculus in polar coordinates",h:7,s:["Area of a polar region: A = ½∫r² dθ.","Arc length in polar form. Slope of a polar curve.","Sketching polar curves and finding their intersections."],m:"You compute polar areas and lengths.",r:L.desmos}
 ]},
 {t:"First-Order Differential Equations",topics:[
  {n:"Separable equations & modelling",h:7,s:["dy/dx = f(x)g(y) → separate variables and integrate both sides.","Include the constant, then use an initial condition to pin it down.","Models: exponential growth/decay, cooling, mixing problems, population."],m:"You solve separable ODEs and interpret the model.",r:L.ode},
  {n:"Linear first-order ODEs & integrating factors",h:7,s:["dy/dx + P(x)y = Q(x). Multiply by the integrating factor e^∫P dx.","Then the left side becomes a perfect derivative — integrate both sides.","Slope fields (direction fields) to visualise solutions without solving.","Euler's method for numerical approximation."],m:"You solve linear first-order ODEs and read slope fields.",r:L.ode}
 ]},
 {t:"✅ Stage 9 Checkpoint",topics:[
  {n:"Checkpoint: Calculus II",h:5,s:["15 integrals using five different techniques (you must name the technique used).","3 volume problems (disk, washer, shell).","10 series: identify convergence/divergence and state the test used.","2 Taylor series derivations.","2 differential equations.","This is the classic 'weed-out' stage. If you pass this, you can learn anything in math."],m:"85%+ with techniques correctly identified.",r:L.calc2}
 ]}
]},
/* ============================ STAGE 10 ============================ */
{id:10,emo:"🧮",t:"Stage 10 · Linear Algebra",sub:"Vectors, matrices, transformations, eigenvalues",
 goal:"The most useful math in the modern world — it powers graphics, machine learning, quantum mechanics, search engines and data science. It is also beautifully visual.",
 mods:[
 {t:"Matrices & Systems",topics:[
  {n:"Systems of linear equations & matrices",h:8,s:["Write a system as an augmented matrix.","Row operations: swap rows, multiply a row by a nonzero constant, add a multiple of one row to another.","Gaussian elimination → row echelon form. Gauss-Jordan → reduced row echelon form.","Read off solutions: unique, none, or infinitely many (free variables)."],m:"You solve any linear system by row reduction and classify the solution set.",r:L.linalg},
  {n:"Matrix arithmetic",h:7,s:["Addition, scalar multiplication, transpose.","Matrix multiplication: rows of the first dot columns of the second. NOT commutative — AB ≠ BA in general.","Powers of matrices, identity matrix, zero matrix.","Always check dimensions are compatible before multiplying."],m:"Matrix multiplication is fluent and you understand why it is defined that way.",r:L.linalg},
  {n:"Matrix inverse & solving AX = B",h:8,s:["A⁻¹ exists only for square, non-singular matrices. AA⁻¹ = I.","Find it by row-reducing [A | I] → [I | A⁻¹].","2×2 formula: (1/det)·[[d,−b],[−c,a]].","Solve systems with X = A⁻¹B. Know when this is and is not efficient."],m:"You compute inverses and use them to solve systems.",r:L.linalg},
  {n:"Determinants",h:8,s:["2×2: ad − bc. 3×3: cofactor expansion along a row or column.","Properties: swapping rows flips the sign; a zero row gives det 0; det(AB) = det(A)det(B).","Geometric meaning: the determinant is the SIGNED AREA (2D) or VOLUME (3D) scaling factor of the transformation. This is the intuition that makes it click.","Cramer's rule, and det = 0 ⟺ matrix is singular."],m:"You compute determinants and explain what they mean geometrically.",r:L.linalg}
 ]},
 {t:"Vector Spaces",topics:[
  {n:"Vectors, span & linear combinations",h:8,s:["A linear combination: c₁v₁ + c₂v₂ + …","The span of a set of vectors is everything you can build from them.","Visualise: one vector spans a line, two independent vectors span a plane, three span space."],m:"You describe the span of a set of vectors geometrically and algebraically.",r:L.linalg},
  {n:"Linear independence",h:8,s:["Vectors are independent if the only way to get the zero vector as a combination is all coefficients zero.","Test: row-reduce. A pivot in every column → independent.","Dependence means one vector is redundant (built from the others)."],m:"You test independence with row reduction and explain it in words.",r:L.linalg},
  {n:"Basis & dimension",h:9,s:["A basis is a set that is both independent AND spans — the minimum complete description of a space.","Dimension = number of basis vectors.","Find a basis for the column space, row space and null space of a matrix.","Coordinates relative to a basis."],m:"You find bases and dimensions of the fundamental subspaces.",r:L.linalg},
  {n:"Subspaces & the four fundamental subspaces",h:9,s:["A subspace must contain the zero vector and be closed under addition and scalar multiplication.","Column space, null space (kernel), row space, left null space.","Rank = number of pivots. Rank–nullity theorem: rank + nullity = number of columns.","This theorem is one of the great results — understand it deeply."],m:"You identify subspaces and apply rank–nullity.",r:L.linalg}
 ]},
 {t:"Transformations & Eigen-stuff",topics:[
  {n:"Linear transformations",h:9,s:["T(u+v) = T(u)+T(v) and T(cu) = cT(u). Every linear transformation IS a matrix, and every matrix IS a transformation.","Standard matrices for rotation, reflection, scaling, shearing, projection.","Kernel (what maps to zero) and image (what you can reach).","Watch 3Blue1Brown's 'Essence of Linear Algebra' series — it will change how you see all of this."],m:"You move between a transformation and its matrix fluently.",r:L.linalg},
  {n:"Change of basis",h:7,s:["The same transformation looks different in different bases.","Transition matrices, similarity: B = P⁻¹AP.","Choosing a good basis can turn a messy problem into a trivial one — that is the whole point of diagonalisation."],m:"You change coordinates between bases.",r:L.linalg},
  {n:"Eigenvalues & eigenvectors",h:12,s:["Av = λv: the transformation stretches v by factor λ without rotating it. These are the 'natural directions' of the matrix.","Find them: solve det(A − λI) = 0 (the characteristic polynomial), then find the null space of (A − λI) for each λ.","Eigenbasis and diagonalisation: A = PDP⁻¹ where D holds the eigenvalues.","Why it matters: Aⁿ becomes trivial to compute, systems of differential equations decouple, principal component analysis in data science, vibration modes, Google's PageRank.","Compute eigenstuff for 15 matrices."],m:"You find eigenvalues/vectors, diagonalise, and explain why it is useful.",r:L.linalg},
  {n:"Orthogonality, projections & least squares",h:11,s:["Dot product, length (norm), and orthogonality (dot = 0 means perpendicular).","Orthogonal complements, orthonormal sets.","Gram–Schmidt process: turn any basis into an orthogonal one. QR factorisation.","Orthogonal projection of a vector onto a subspace.","Least squares: when Ax = b has no solution, find the x that minimises the error. This is the mathematics behind curve fitting, regression and all of machine learning."],m:"You do Gram–Schmidt, projections and least squares problems.",r:L.linalg}
 ]},
 {t:"Applications & Next Steps",topics:[
  {n:"Applications of linear algebra",h:8,s:["Markov chains and steady-state vectors.","Computer graphics: 3D transforms, camera matrices.","Data science: PCA, dimensionality reduction, recommendation systems.","Solving large systems numerically; why we care about condition numbers.","Pick one and build a small project (a Python script with NumPy is a great way)."],m:"You can explain one real application in depth.",r:L.linalg},
  {n:"Bridge: linear algebra + calculus",h:6,s:["Systems of differential equations solved with eigenvalues.","Matrix exponentials eᴬᵗ.","This is where Stage 10 and Stage 12 meet, and it is very satisfying."],m:"You see how the two subjects connect.",r:L.ode}
 ]},
 {t:"✅ Stage 10 Checkpoint",topics:[
  {n:"Checkpoint: Linear Algebra",h:4,s:["Solve a 3×3 system by row reduction and classify it.","Compute a determinant and an inverse.","Find bases for column space and null space; verify rank–nullity.","Find eigenvalues and eigenvectors of a 3×3 matrix and diagonalise it.","Run Gram–Schmidt on a set of 3 vectors.","One least-squares problem."],m:"90%+ — linear algebra is cumulative and unforgiving of gaps.",r:L.linalg}
 ]}
]},
/* ============================ STAGE 11 ============================ */
{id:11,emo:"🎲",t:"Stage 11 · Probability & Statistics",sub:"Data, uncertainty, distributions, inference",
 goal:"The math of the real, messy world. This is how you read news critically, run experiments, and understand every machine-learning claim you will ever meet.",
 mods:[
 {t:"Descriptive Statistics",topics:[
  {n:"Data types & collecting data",h:5,s:["Qualitative vs quantitative; discrete vs continuous.","Population vs sample. Sampling methods: random, stratified, cluster, systematic.","Bias: selection bias, response bias, survivorship bias. Learn to spot bad data."],m:"You classify data and recognise sampling bias.",r:L.stats},
  {n:"Measures of centre",h:5,s:["Mean (sensitive to outliers), median (robust), mode.","Which to use when — skewed distributions make the mean misleading (income is the classic example).","Weighted mean."],m:"You choose and compute the right measure of centre.",r:L.stats},
  {n:"Measures of spread",h:7,s:["Range, interquartile range (IQR = Q3 − Q1), variance, standard deviation.","Variance = average of squared deviations. Standard deviation is in the original units — that is why we use it.","Population vs sample variance (the n−1 correction) and why it exists.","Coefficient of variation for comparing spreads across different scales."],m:"You compute and interpret every measure of spread.",r:L.stats},
  {n:"Visualising data",h:6,s:["Histograms, boxplots, bar charts, scatterplots, stem-and-leaf.","Read shape: symmetric, skewed left/right, bimodal, uniform.","Outliers: the 1.5 × IQR rule.","Learn to lie with graphs (truncated axes) so you can spot it in the news."],m:"You choose the right chart and read it critically.",r:L.stats}
 ]},
 {t:"Probability",topics:[
  {n:"Probability fundamentals & counting",h:9,s:["P(event) = favourable outcomes / total outcomes (for equally likely cases). 0 ≤ P ≤ 1.","Complement: P(not A) = 1 − P(A). Union: P(A∪B) = P(A)+P(B)−P(A∩B).","Counting: fundamental principle, permutations (order matters) nPr, combinations (order does not) nCr = n!/(r!(n−r)!).","Odds vs probability. Tree diagrams for multi-stage experiments."],m:"You compute probabilities using correct counting.",r:L.stats},
  {n:"Conditional probability & independence",h:8,s:["P(A|B) = P(A∩B)/P(B) — probability of A given B has happened.","Multiplication rule. Independence: P(A∩B) = P(A)P(B).","Conditional vs independent are easy to confuse — practise telling them apart.","The prosecutor's fallacy and base-rate neglect: P(A|B) ≠ P(B|A)."],m:"You handle conditional probability without the classic errors.",r:L.stats},
  {n:"Bayes' theorem",h:8,s:["P(A|B) = P(B|A)P(A) / P(B). Update beliefs with evidence.","Law of total probability first — it builds the denominator.","Worked classic: a disease test that is 99% accurate, disease prevalence 1 in 1000 → a positive result means only ~9% chance of disease. Do this one; it rewires your brain.","This is the foundation of Bayesian statistics and machine learning."],m:"You solve Bayes problems including the total-probability step.",r:L.stats}
 ]},
 {t:"Distributions",topics:[
  {n:"Random variables & expected value",h:7,s:["A random variable assigns a number to each outcome.","Probability mass function (discrete) and probability density function (continuous).","Expected value E(X) = Σ x·P(x) — the long-run average, not the most likely value.","Variance and standard deviation of a random variable. Linearity of expectation."],m:"You compute E(X) and Var(X) for a given distribution.",r:L.stats},
  {n:"Discrete distributions",h:9,s:["Bernoulli and Binomial: n independent trials, success probability p. P(X=k) = C(n,k)pᵏ(1−p)ⁿ⁻ᵏ. Mean np, variance np(1−p).","Geometric: number of trials until first success.","Poisson: counts of rare events per interval. P(X=k) = e^(−λ)λᵏ/k!. Mean = variance = λ.","Know when to use each — write a one-page decision guide."],m:"You pick and apply the right discrete distribution.",r:L.stats},
  {n:"The normal distribution",h:10,s:["The bell curve. Fully described by mean μ and standard deviation σ.","68–95–99.7 rule. Density function, and why the total area is 1.","Standard normal Z = (X − μ)/σ. Use Z-tables or a calculator.","Normal approximation to the binomial.","Normal distributions appear everywhere — understand the Central Limit Theorem to see why."],m:"You standardise, use Z-tables and solve normal problems.",r:L.stats},
  {n:"Other continuous distributions",h:6,s:["Uniform, exponential (waiting times, memoryless property), and gamma/beta at an intro level.","Relationship between exponential and Poisson."],m:"You recognise and use the exponential and uniform distributions.",r:L.stats},
  {n:"Sampling distributions & the Central Limit Theorem",h:9,s:["A statistic (like the sample mean) is itself a random variable with its own distribution.","Standard error = σ/√n. Bigger samples → less error.","CLT: the mean of many samples is approximately normal regardless of the original distribution, if n is large enough.","This single theorem is why statistics works at all. Simulate it yourself with a spreadsheet or Python."],m:"You can state the CLT and compute standard errors.",r:L.stats}
 ]},
 {t:"Statistical Inference",topics:[
  {n:"Confidence intervals",h:9,s:["A 95% CI means: if we repeated this process many times, 95% of the intervals would contain the true value.","CI = estimate ± critical value × standard error.","For a mean (z and t versions), for a proportion, for a difference of two means.","Interpretation matters more than calculation — practise explaining a CI to a non-math friend."],m:"You construct and correctly interpret confidence intervals.",r:L.stats},
  {n:"Hypothesis testing",h:12,s:["Null hypothesis H₀ vs alternative H₁. One-tailed vs two-tailed.","Test statistic → p-value = probability of seeing data this extreme if H₀ were true.","Compare p to significance level α (usually 0.05). Reject or fail to reject.","Type I error (false positive) and Type II error (false negative). Power of a test.","NEVER say 'accept H₀' — you fail to reject it. Learn to explain why."],m:"You run a full hypothesis test and interpret the p-value honestly.",r:L.stats},
  {n:"Common tests: t, z, chi-square, ANOVA",h:10,s:["One-sample and two-sample t-tests; paired t-test.","z-test for proportions.","Chi-square goodness of fit and test of independence (contingency tables).","One-way ANOVA for comparing three or more group means.","Build a flowchart: which test for which situation?"],m:"You select and perform the right test for a data problem.",r:L.stats},
  {n:"Correlation & regression",h:11,s:["Scatterplots first, always. Then correlation coefficient r (−1 to +1).","r measures LINEAR association only — a strong curve gives r ≈ 0.","Least squares regression line y = a + bx; residuals and residual plots; R².","Multiple regression at an intro level.","CORRELATION IS NOT CAUSATION — learn the confounding-variable examples."],m:"You fit and interpret a regression model with appropriate caution.",r:L.stats},
  {n:"Doing statistics with tools",h:8,s:["Spreadsheet first: means, standard deviations, charts, regression.","Then Python (with pandas/matplotlib) or R — free and industry standard.","Do one real project: collect or download a dataset, describe it, test a hypothesis, write a one-page conclusion."],m:"You complete an end-to-end data analysis with a real tool.",r:L.stats}
 ]},
 {t:"✅ Stage 11 Checkpoint",topics:[
  {n:"Checkpoint: Probability & Statistics",h:4,s:["5 probability problems including one Bayes question.","3 distribution problems (binomial, Poisson, normal).","Construct 2 confidence intervals and interpret them in words.","Run 2 hypothesis tests end to end.","Compute r and a regression line for a small dataset, and state whether causation is implied (it never is)."],m:"85%+ and correct interpretations.",r:L.stats}
 ]}
]},
/* ============================ STAGE 12 ============================ */
{id:12,emo:"🧩",t:"Stage 12 · Discrete Math & Proof",sub:"Logic, sets, combinatorics, number theory, graphs",
 goal:"This is where you learn to think like a mathematician. Everything before this was calculation; from here on it is argument. It is also the mathematical foundation of computer science.",
 mods:[
 {t:"Logic & Proof",topics:[
  {n:"Propositional logic & truth tables",h:8,s:["Statements, negation, conjunction (AND), disjunction (OR), implication (→), biconditional (↔).","Build truth tables for all of them.","Tautology, contradiction, logical equivalence. De Morgan's laws.","Implication is the tricky one: 'false implies anything' is TRUE. Sit with that until it makes sense.","Converse, inverse, contrapositive — only the contrapositive is equivalent to the original."],m:"You construct truth tables and test logical equivalence.",r:L.discrete},
  {n:"Quantifiers & predicates",h:7,s:["∀ (for all) and ∃ (there exists). Order matters enormously: ∀x∃y is not the same as ∃y∀x.","Negating quantified statements: ¬∀x P(x) = ∃x ¬P(x).","Translate everyday sentences into formal logic and back.","Practise with 'every student has a locker' vs 'there is a locker for every student'."],m:"You translate and negate quantified statements correctly.",r:L.discrete},
  {n:"Proof techniques",h:14,s:["Direct proof: assume the hypothesis, derive the conclusion.","Contrapositive: prove ¬Q → ¬P instead.","Contradiction: assume the opposite and derive nonsense (classic: √2 is irrational).","Proof by cases.","Existence proofs (constructive and non-constructive). Counterexamples to disprove.","Write 20 proofs. Read a model proof, close the book, rewrite it from memory the next day. This is the ONLY way to learn proof."],m:"You can write a clear, valid proof using the right technique.",r:L.discrete},
  {n:"Mathematical induction",h:10,s:["Two steps: (1) base case, (2) assume true for n = k, prove for n = k+1.","The domino analogy: knock the first, and prove each knocks the next.","Strong induction, and well-ordering.","Prove summation formulas, divisibility statements, inequalities.","Induction is a powerful machine — drill it until it feels natural."],m:"You write complete induction proofs.",r:L.discrete}
 ]},
 {t:"Sets, Functions & Relations",topics:[
  {n:"Set theory",h:8,s:["Notation: ∈, ⊆, ∪, ∩, complement, set difference, Cartesian product.","Venn diagrams. Set identities and how to prove them (element-chasing or algebraically).","Power set, cardinality, finite vs infinite sets.","Russell's paradox — the fun crisis at the foundation of math."],m:"You operate with sets and prove set identities.",r:L.discrete},
  {n:"Functions: injective, surjective, bijective",h:9,s:["One-to-one (injective): different inputs give different outputs. Onto (surjective): every output is hit. Bijective: both.","Only bijections have true inverses.","Composition of functions. Cardinality via bijections — this is how you compare the sizes of infinite sets.","Cantor's diagonal argument: the reals are strictly 'bigger' than the naturals. Read it; it is mind-bending."],m:"You classify functions and construct bijections.",r:L.discrete},
  {n:"Relations, equivalence & orderings",h:8,s:["Properties: reflexive, symmetric, antisymmetric, transitive.","Equivalence relations partition a set into classes (modular arithmetic is the classic example).","Partial orders, Hasse diagrams, total orders.","This is the abstract machinery behind 'same remainder when divided by n'."],m:"You classify relations and describe equivalence classes.",r:L.discrete}
 ]},
 {t:"Counting & Number Theory",topics:[
  {n:"Combinatorics",h:11,s:["Permutations, combinations, with and without repetition.","The binomial theorem and binomial coefficients — now proved properly.","Multinomial coefficients. Compositions and partitions.","Inclusion–exclusion principle: |A∪B∪C| and beyond.","Pigeonhole principle — a ridiculously simple idea that proves astonishing things.","Generating functions (intro): encode a counting problem as a polynomial."],m:"You solve counting problems with the right technique, including inclusion–exclusion.",r:L.discrete},
  {n:"Number theory & modular arithmetic",h:13,s:["Division algorithm: a = bq + r with 0 ≤ r < b.","Congruences: a ≡ b (mod n). Arithmetic mod n, solving linear congruences.","Primes, the Fundamental Theorem of Arithmetic, and the infinitude of primes (Euclid's proof).","Euclidean algorithm for GCD, and Bézout's identity.","Fermat's Little Theorem, Euler's theorem, φ(n).","Chinese Remainder Theorem.","Why it matters: RSA encryption — the reason your bank details are safe — is exactly this material."],m:"You compute modular arithmetic and apply the main theorems.",r:L.discrete},
  {n:"Graph theory",h:11,s:["Vertices, edges, degree, paths, cycles, connectedness.","Trees and spanning trees. A tree with n vertices has n−1 edges.","Euler circuits (cross every edge once — Königsberg bridges) and Hamilton cycles (visit every vertex once).","Planarity, Euler's formula V − E + F = 2.","Graph colouring and the four-colour theorem. Bipartite graphs.","Applications: networks, scheduling, maps, social graphs, routing."],m:"You analyse graphs and apply Euler's formula.",r:L.discrete}
 ]},
 {t:"Computing Connections",topics:[
  {n:"Recursion, algorithms & complexity",h:9,s:["Recursive definitions and proving them correct by induction.","Big-O notation: growth rates of functions. Compare n, n log n, n², 2ⁿ.","Solving simple recurrences (Fibonacci, divide-and-conquer).","Why this matters: it decides whether a program is usable or not."],m:"You analyse the complexity of a simple algorithm.",r:L.discrete},
  {n:"Boolean algebra & logic circuits (optional)",h:6,s:["Boolean operations, truth tables → gates (AND, OR, NOT, XOR).","Simplification with Karnaugh maps.","This is how every computer chip is designed."],m:"You simplify a Boolean expression.",r:L.discrete}
 ]},
 {t:"✅ Stage 12 Checkpoint",topics:[
  {n:"Checkpoint: Discrete Math & Proof",h:4,s:["Write 5 proofs using 5 different techniques (direct, contrapositive, contradiction, induction, cases).","3 counting problems including one needing inclusion–exclusion.","3 modular arithmetic problems.","2 graph theory problems.","If you can write a clean induction proof, you have genuinely learned to do mathematics."],m:"All proofs valid and clearly written.",r:L.discrete}
 ]}
]},
/* ============================ STAGE 13 ============================ */
{id:13,emo:"∞",t:"Stage 13 · Real Analysis",sub:"Rigorous calculus: the epsilons finally earn their keep",
 goal:"You re-do calculus properly, with proofs. This is the transition from 'student who can compute' to 'mathematician who can prove'. Hard, and completely worth it.",
 mods:[
 {t:"The Real Numbers & Sequences",topics:[
  {n:"The real number system & completeness",h:12,s:["Field axioms, order axioms, and the Completeness Axiom — the property that makes ℝ different from ℚ.","Supremum (least upper bound) and infimum. Prove things have suprema.","Archimedean property, density of ℚ in ℝ.","Constructing ℝ: Dedekind cuts or Cauchy sequences (read about one of them).","This is the ground everything else stands on. Go slowly."],m:"You understand and use completeness, sup and inf rigorously.",r:L.analysis},
  {n:"Sequences of real numbers",h:14,s:["Formal definition of convergence: for all ε > 0 there is N such that n > N implies |aₙ − L| < ε.","Prove convergence from the definition (do 10 by hand).","Limit laws for sequences, squeeze theorem.","Monotone Convergence Theorem: bounded + monotone → convergent.","Bolzano–Weierstrass: every bounded sequence has a convergent subsequence.","Cauchy sequences and completeness.","Subsequences and their limits."],m:"You prove convergence and divergence rigorously.",r:L.analysis},
  {n:"Infinite series (rigorous)",h:12,s:["Convergence of series via partial sums. Absolute vs conditional convergence.","All tests, now with proofs: comparison, ratio, root, integral, alternating series, Dirichlet and Abel.","Rearrangement of conditionally convergent series (Riemann's shocking theorem).","Power series and uniform convergence."],m:"You prove convergence results, not just apply them.",r:L.analysis}
 ]},
 {t:"Continuity & Differentiation",topics:[
  {n:"Limits and continuity of functions (rigorous)",h:14,s:["ε–δ definition of a function limit. Prove limits from scratch.","Continuity, and operations preserving continuity.","Continuous functions on a closed bounded interval: Extreme Value Theorem, Intermediate Value Theorem, uniform continuity.","Compactness and connectedness — first encounter.","Pointwise vs uniform convergence, and why uniform matters (it preserves continuity)."],m:"You write ε–δ proofs and prove the main theorems on continuous functions.",r:L.analysis},
  {n:"Differentiation (rigorous)",h:13,s:["Definition of the derivative as a limit; differentiability implies continuity.","Prove the product, quotient and chain rules.","Rolle's theorem and the Mean Value Theorem — proved, not just stated.","Consequences: monotonicity criteria, L'Hôpital's rule proved.","Taylor's theorem with various forms of the remainder. Convexity."],m:"You prove the central theorems of differential calculus.",r:L.analysis},
  {n:"The Riemann integral",h:14,s:["Partitions, upper and lower sums, upper and lower integrals.","Riemann integrability criterion (the ε condition).","Which functions are integrable: continuous ones, monotone ones, and the shocks.","Properties of the integral, the Mean Value Theorem for integrals.","Both Fundamental Theorems of Calculus, fully proved.","Then meet the Lebesgue integral and understand why Riemann's version is not enough."],m:"You understand integrability rigorously and can prove the FTC.",r:L.analysis}
 ]},
 {t:"Going Further",topics:[
  {n:"Metric spaces (intro)",h:12,s:["A metric: distance function satisfying positivity, symmetry, triangle inequality.","Open and closed sets, balls, interior, boundary.","Convergence and continuity in metric spaces — suddenly all your analysis theorems generalise.","Completeness, contraction mapping and Banach's fixed point theorem (a genuinely useful result)."],m:"You work comfortably in abstract metric spaces.",r:L.analysis},
  {n:"A capstone project",h:10,s:["Pick one: prove the irrationality of e; construct a continuous nowhere-differentiable function; prove the Fundamental Theorem of Algebra; work through the Stone–Weierstrass theorem.","Write it up cleanly, in your own words, as a proper document.","Explaining it to someone else is the final test of understanding (the Feynman technique)."],m:"You have written a rigorous proof document you are proud of.",r:L.analysis}
 ]},
 {t:"✅ Stage 13 Checkpoint",topics:[
  {n:"Checkpoint: Real Analysis",h:5,s:["Prove 3 sequence convergences from the ε–N definition.","Write 2 ε–δ continuity proofs.","Prove the Mean Value Theorem from Rolle's theorem.","Prove that a continuous function on [a,b] is bounded.","Prove √2 is irrational and that a monotone bounded sequence converges.","If you can do these, you are doing real mathematics."],m:"All proofs valid and complete.",r:L.analysis}
 ]}
]},
/* ============================ STAGE 14 ============================ */
{id:14,emo:"🌊",t:"Stage 14 · Multivariable Calculus & ODEs",sub:"Calculus in 3D, vector fields, differential equations",
 goal:"The mathematics of the physical world: fluids, fields, heat, motion, electromagnetism. Everything here has a beautiful geometric picture — keep drawing.",
 mods:[
 {t:"Multivariable Differentiation",topics:[
  {n:"Functions of several variables",h:8,s:["Domain, range, level curves and contour plots. Visualise surfaces in 3D.","Limits and continuity in two variables — approach along different paths to show a limit does not exist.","This path-dependence is the big new wrinkle compared to single-variable calculus."],m:"You analyse multivariable limits using paths.",r:L.multivar},
  {n:"Partial derivatives & the gradient",h:11,s:["∂f/∂x: differentiate with respect to x, treating y as constant.","Higher-order partials, Clairaut's theorem (mixed partials are equal).","Gradient ∇f points in the direction of steepest increase — its magnitude is the rate.","Directional derivatives: D_u f = ∇f · u.","Tangent planes and linear approximation in 3D. Differentials."],m:"You compute gradients, directional derivatives and tangent planes.",r:L.multivar},
  {n:"The multivariable chain rule",h:8,s:["Tree diagrams for dependent variables.","Chain rule for one and several parameters.","Implicit differentiation in several variables.","Applications to related rates in 3D."],m:"You apply the multivariable chain rule.",r:L.multivar},
  {n:"Extrema & Lagrange multipliers",h:12,s:["Critical points where ∇f = 0.","Second derivative test with the Hessian determinant D = f_xx f_yy − (f_xy)².","Constrained optimisation: maximise f subject to g = c → ∇f = λ∇g.","Interpret λ as the sensitivity (shadow price) — hugely useful in economics.","Real problems: closest point, maximum volume with a material constraint."],m:"You solve constrained and unconstrained optimisation problems.",r:L.multivar}
 ]},
 {t:"Multivariable Integration",topics:[
  {n:"Double & triple integrals",h:12,s:["Double integral = volume under a surface. Set up the limits by sketching the region.","Iterated integrals, Fubini's theorem. Changing the order of integration (often makes an impossible integral easy).","Triple integrals for volume, mass and centre of mass.","Average value of a function over a region."],m:"You set up and evaluate double and triple integrals over general regions.",r:L.multivar},
  {n:"Change of variables & Jacobians",h:11,s:["Polar coordinates: dA = r dr dθ. Use for circular regions.","Cylindrical and spherical coordinates for 3D solids.","The Jacobian determinant is the general scaling factor — this is the deep idea behind all substitutions.","Compute volumes of spheres, cones and tori to check your work."],m:"You choose and apply the right coordinate system.",r:L.multivar}
 ]},
 {t:"Vector Calculus",topics:[
  {n:"Vector fields, line integrals & work",h:12,s:["A vector field assigns a vector to every point (wind, gravity, fluid flow).","Line integrals of scalar and vector fields. Work done by a force along a path.","Conservative fields and potential functions. Path independence.","Curl and divergence — what they measure physically (rotation and expansion)."],m:"You evaluate line integrals and test whether a field is conservative.",r:L.multivar},
  {n:"Green's, Stokes' and the Divergence Theorem",h:14,s:["Green's theorem: a line integral around a closed 2D curve equals a double integral of curl over the region.","Stokes' theorem: the 3D generalisation — circulation around a boundary equals flux of curl through the surface.","Divergence theorem: flux through a closed surface equals the integral of divergence inside.","All three are the same idea: 'the whole equals the sum of its boundary'. Understand that unity and these theorems stop being three separate monsters.","Applications: fluid flow, electromagnetism (Maxwell's equations are written in exactly this language)."],m:"You apply the three big theorems and explain how they relate.",r:L.multivar}
 ]},
 {t:"Differential Equations",topics:[
  {n:"Second-order linear ODEs",h:12,s:["Constant coefficients: solve the characteristic equation ar² + br + c = 0.","Three cases: distinct real roots, repeated root, complex roots (which give oscillation via eᵃᵗcos bt).","Homogeneous solutions, then non-homogeneous: method of undetermined coefficients and variation of parameters.","Mass–spring–damper systems: underdamped, critically damped, overdamped. Resonance."],m:"You solve second-order linear ODEs and interpret them physically.",r:L.ode},
  {n:"Laplace transforms",h:10,s:["L{f(t)} = ∫₀^∞ e^(−st) f(t) dt — turns calculus into algebra.","Transforms of standard functions, first and second shifting theorems.","Solve ODEs (especially with discontinuous or impulsive forcing) by transforming, solving algebraically, and transforming back.","Partial fractions come back — Stage 4 pays off again."],m:"You solve ODEs with Laplace transforms.",r:L.ode},
  {n:"Systems of ODEs & qualitative analysis",h:11,s:["Write a system as x′ = Ax. Solve with eigenvalues and eigenvectors (Stage 10 returns!).","Matrix exponential eᴬᵗ.","Phase portraits, equilibrium points: node, saddle, spiral, centre. Stability.","Eigenvalue signs determine the behaviour — a lovely connection between two subjects."],m:"You analyse and solve linear systems of ODEs.",r:L.ode},
  {n:"Numerical methods for ODEs (optional but useful)",h:8,s:["Euler's method, improved Euler (Heun), and Runge–Kutta (RK4).","Step size, error, stability.","Implement one in Python or a spreadsheet and compare with an exact solution."],m:"You can numerically approximate a solution and discuss its error.",r:L.ode}
 ]},

 ]}

 goal:"Modern mathematics proper. Structures, spaces and functions of a complex variable. Also where you pick a direction: pure math, applied, data, physics, finance or CS.",
 mods:[
 {t:"Abstract Algebra",topics:[
  {n:"Groups",h:16,s:["A set with an operation satisfying closure, associativity, identity and inverses.","Examples: integers under addition, symmetries of a shape, invertible matrices, ℤₙ under addition mod n.","Subgroups, cyclic groups, order of an element.","Cosets and Lagrange's theorem (subgroup order divides group order).","Homomorphisms and isomorphisms — structure-preserving maps.","Normal subgroups and quotient groups. Symmetric groups and permutations.","Sylow theorems (advanced)."],m:"You recognise groups, find subgroups, and apply Lagrange's theorem.",r:L.algebra2},
  {n:"Rings, fields & Galois theory",h:18,s:["Rings: two operations (addition and multiplication) with the right axioms. ℤ, polynomials, matrices.","Integral domains, zero divisors, units. Ideals and quotient rings.","Fields: every nonzero element invertible. ℚ, ℝ, ℂ, finite fields.","Field extensions, algebraic and transcendental elements.","Galois theory: the connection between field extensions and groups — and the proof that there is no formula for quintic equations. One of the most beautiful results in all of mathematics."],m:"You work with rings and fields and can outline the Galois correspondence.",r:L.algebra2},
  {n:"Modules, representations & category theory (elective)",h:14,s:["Modules: vector spaces over a ring.","Representation theory: studying groups via matrices.","Category theory: objects, morphisms, functors, natural transformations — 'mathematics of mathematics'.","Do this only if you enjoyed the abstraction. It is genuinely rewarding."],m:"You can follow the definitions and basic results.",r:L.algebra2}
 ]},
 {t:"Topology & Complex Analysis",topics:[
  {n:"Topology",h:18,s:["Metric spaces → topological spaces: open sets as the primitive notion.","Closed sets, closure, interior, boundary.","Continuity defined purely in terms of open sets.","Compactness (every open cover has a finite subcover) and connectedness.","Hausdorff, product and quotient topologies.","Homeomorphism: 'topologically the same'. A coffee mug and a doughnut.","Classification of surfaces, fundamental group (intro)."],m:"You prove basic topological results about compactness and connectedness.",r:L.topology},
  {n:"Complex analysis",h:18,s:["Complex functions, limits and the Cauchy–Riemann equations.","Holomorphic (complex-differentiable) and analytic functions — surprisingly, differentiable once means infinitely many times.","Complex exponential, e^(iθ) = cos θ + i sin θ (Euler's formula — see why it is true).","Contour integrals. Cauchy's integral theorem and integral formula.","Power series and Laurent series. Singularities: removable, poles, essential.","The Residue Theorem — a machine for evaluating otherwise brutal real integrals.","The spectacular theorems: Liouville, Maximum Modulus, Fundamental Theorem of Algebra, Picard."],m:"You evaluate contour integrals with residues and state the main theorems.",r:L.complex},
  {n:"Measure theory & functional analysis (elective)",h:16,s:["Lebesgue measure and the Lebesgue integral — the correct generalisation of Riemann's.","Measurable functions, convergence theorems (dominated, monotone).","Lᵖ spaces. Normed spaces, Banach and Hilbert spaces.","Operators, spectra, and the foundations of quantum mechanics.","This is graduate-level. Approach it only after Stage 13 is solid."],m:"You understand the definitions and can follow the main proofs.",r:L.analysis}
 ]},
 {t:"Applied & Computational Electives",topics:[
  {n:"Numerical analysis",h:14,s:["Floating-point arithmetic and error analysis. Conditioning and stability.","Root finding: bisection, Newton–Raphson, secant.","Interpolation, splines, least-squares fitting.","Numerical differentiation and integration (trapezium, Simpson's).","Solving large linear systems iteratively (Jacobi, Gauss–Seidel).","Numerical ODEs and PDEs (finite difference)."],m:"You implement a numerical method and analyse its error.",r:L.multivar},
  {n:"Mathematical finance & actuarial math (elective)",h:14,s:["Time value of money, annuities, bonds, yield curves.","Stochastic calculus intro: Brownian motion, Itô's lemma.","Option pricing: Black–Scholes derivation and intuition.","Risk measures, portfolio theory, Monte Carlo simulation."],m:"You can price a simple derivative and explain the model.",r:L.stats},
  {n:"Optimization & operations research (elective)",h:12,s:["Linear programming, the simplex method, duality.","Convexity and convex optimisation.","Integer programming, network flows, matching.","Gradient descent and its variants — the engine of all machine learning.","Game theory: Nash equilibria."],m:"You formulate and solve an optimisation problem.",r:L.linalg},
  {n:"Cryptography & information theory (elective)",h:12,s:["Number theory applied: RSA, Diffie–Hellman, elliptic curve cryptography.","Hash functions, digital signatures, zero-knowledge proofs.","Entropy, source coding, Shannon's theorems, error-correcting codes.","Build a toy RSA implementation from scratch to make it real."],m:"You can explain and implement basic public-key cryptography.",r:L.discrete},

  {n:"Capstone: prove, teach or build something",h:20,s:["Choose one: write a rigorous proof paper on a theorem you love; teach a full concept to a real person and get them to understand it; build a working project (a physics simulation, a machine-learning model from scratch, a cryptography library, a math visualisation).","Public accountability: publish it, share it, or explain it to someone.","Teaching is the ultimate test. If you can explain it simply, you own it."],m:"You have created something mathematical that exists outside your notebook.",r:L.precalc}
 ]},

 ]}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function p2(n){return n<10?'0'+n:''+n}
function dstr(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}

function addD(ds,n){var p=ds.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return dstr(d)}

function pick(a){return a[R(0,a.length-1)]}

(function(){var i=0;STAGES.forEach(function(st){st.mods.forEach(function(m,mi){m.topics.forEach(function(t,ti){

function isDone(id){return !!S.done[id]}
function doneCount(){var c=0;for(var k in S.done)if(S.done[k])c++;return c}
function doneHours(){var h=0;FLAT.forEach(function(o){if(S.done[o.id])h+=o.t.h});return h}
function stageStat(sid){var st=STAGES.filter(function(s){return s.id===sid})[0];var tot=0,dn=0;st.mods.forEach(function(m){m.topics.forEach(function(t){tot++;})});
  FLAT.forEach(function(o){if(o.sid===sid){if(S.done[o.id])dn++}});return{tot:tot,dn:dn,pct:tot?Math.round(dn/tot*100):0}}
function act(d){if(S.log[d]>0)return true;for(var k in S.doneAt)if(S.doneAt[k]===d)return true;return false}
function streak(){var n=0,d=today();if(!act(d))d=addD(d,-1);while(act(d)){n++;d=addD(d,-1);if(n>4000)break}return n}
function totalMin(){var s=0;for(var k in S.log)s+=S.log[k];return s}
function nextUp(){for(var i=0;i<FLAT.length;i++)if(!S.done[FLAT[i].id])return FLAT[i];return null}
function currentStage(){var n=nextUp();return n?n.sid:STAGES[STAGES.length-1].id}
function fmtDate(ds){var p=ds.split('-');var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return p[2]+' '+M[+p[1]-1]+' '+p[0]}

  /* projection */
  var remH=TOT.hours-hrs, daysLeft=S.mins>0?Math.ceil(remH*60/S.mins):0, eta=addD(today(),daysLeft);

  h+='<p style="font-size:12.5px;color:var(--dim);margin:12px 0 0">Don\'t panic about that date. The early stages fly by — most people finish Stages 0–2 in a few months. The number matters less than the streak.</p></div></div>';

  /* stage overview */
  h+='<div class="card" style="margin-top:14px"><h2>🗺️ The 16 stages</h2><p class="sub" style="margin-bottom:12px">Click any stage to open it in the roadmap.</p>';
  STAGES.forEach(function(st){var s=stageStat(st.id);var cur=st.id===currentStage();
    h+='<div style="display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer" data-act="openstage" data-id="'+st.id+'">';

    if(cur)h+='<span class="pill now" style="margin-left:6px">YOU</span>';

  h+='</div>';

  var rec=FLAT.filter(function(o){return S.doneAt[o.id]}).sort(function(a,b){return S.doneAt[b.id]<S.doneAt[a.id]?-1:1}).slice(0,6);

    rec.forEach(function(o){h+='<tr><td style="width:90px;color:var(--dim)">'+fmtDate(S.doneAt[o.id])+'</td><td><b>'+esc(o.t.n)+'</b><br><span style="font-size:12px;color:var(--dim)">'+esc(o.sname)+' → '+esc(o.mod)+'</span></td></tr>'});
    h+='</tbody></table></div>'}
  h+='<div class="card" style="margin-top:14px"><h2>🧠 The 5 rules that decide whether this works</h2><ol style="padding-left:20px;font-size:14.5px;margin:8px 0 0">';
  ['<b>Never skip a stage.</b> Math is a tower. A gap in Stage 1 makes Stage 8 feel impossible. If something feels hard, the problem is almost always one stage earlier.',
   '<b>Do problems, don\'t watch videos.</b> Watching feels like learning; it is not. Rule of thumb: 20% learning, 80% solving with a pen and paper.',
   '<b>Keep an Error Log.</b> Use the note box on each topic. Write down every mistake and WHY. Re-reading your own mistakes is the fastest learning trick there is.',
   '<b>Small and daily beats heroic and weekly.</b> '+S.mins+' minutes every day, seven days a week. The streak counter on this page is your boss.',
   '<b>Explain it out loud.</b> If you can teach a concept to a 12-year-old, you own it. If you stumble, you found your gap.'].forEach(function(x){h+='<li style="margin:8px 0">'+x+'</li>'});

function reviewQueue(n){var now=today(),out=[];FLAT.forEach(function(o){var d=S.doneAt[o.id];if(!d)return;
  var p1=now.split('-'),p2x=d.split('-');var a=new Date(+p1[0],+p1[1]-1,+p1[2]),b=new Date(+p2x[0],+p2x[1]-1,+p2x[2]);
  var days=Math.round((a-b)/86400000);if(days>=14)out.push({o:o,days:days})});
  out.sort(function(x,y){return y.days-x.days});return out.slice(0,n||5).map(function(x){return x.o})}

var DR={mode:'L2',sub:'quiz',n:12,i:0,ok:0,streak:0,q:null,t0:0,fb:null,sprint:0,sq:0,sok:0,sprintT:0,deck:[],di:0,rev:false,missed:0,missq:[]};
function GENQ(mode){
  var a,b,c,op;
  if(mode==='TAB'){a=R(2,12);b=R(2,12);return{q:a+' × '+b,a:a*b}}
  if(mode==='SQ'){a=R(2,25);return{q:a+'² = ?',a:a*a}}
  if(mode==='MIX'){return GENQ(pick(['L1','L2','L3','L4','L5']))}
  if(mode==='L1'){op=pick(['+','−']);a=R(1,9);b=R(1,9);if(op==='−'&&b>a){var t=a;a=b;b=t}return{q:a+' '+op+' '+b,a:op==='+'?a+b:a-b}}
  if(mode==='L2'){op=pick(['+','−']);a=R(10,89);b=R(10,99);if(op==='−'&&b>a){var t2=a;a=b;b=t2}return{q:a+' '+op+' '+b,a:op==='+'?a+b:a-b}}
  if(mode==='L3'){op=pick(['+','−']);a=R(100,899);b=R(100,999);if(op==='−'&&b>a){var t3=a;a=b;b=t3}return{q:a+' '+op+' '+b,a:op==='+'?a+b:a-b}}
  if(mode==='L4'){var k=pick(['mul','div']);if(k==='mul'){a=R(3,19);b=R(3,9);return{q:a+' × '+b,a:a*b}}a=R(3,12);b=R(3,12);return{q:(a*b)+' ÷ '+a+' = ?',a:b}}
  if(mode==='L5'){var k2=pick(['mul','div','pct','frac']);
    if(k2==='mul'){a=R(11,49);b=R(3,9);return{q:a+' × '+b,a:a*b}}
    if(k2==='div'){b=R(3,12);c=R(3,12);a=b*c+R(0,b-1);return{q:a+' ÷ '+b+' = ? (remainder '+(a%b)+')',a:Math.floor(a/b)}}
    if(k2==='pct'){var p=pick([5,10,20,25,50,75]);a=pick([40,60,80,120,150,200,240,400,500,800]);return{q:p+'% of '+a,a:p*a/100}}
    var den=pick([2,4,5,10]);a=den*R(2,9);var num=R(1,den-1);return{q:num+'/'+den+' of '+a+' = ?',a:num*a/den}}
  return{q:'1 + 1',a:2};
}

function flashDeck(){

  for(i=2;i<=12;i++)d.push({q:i+'³ = ?',a:String(i*i*i),g:'Cubes'});

  [['50%','1/2'],['25%','1/4'],['75%','3/4'],['20%','1/5'],['10%','1/10'],['5%','1/20'],['12.5%','1/8'],['33.3%','1/3'],['66.7%','2/3'],['60%','3/5'],['40%','2/5'],['80%','4/5']].forEach(function(p){d.push({q:p[0]+' as a fraction = ?',a:p[1],g:'Percents↔Fractions'})});
  [['(a+b)²','a² + 2ab + b²'],['(a−b)²','a² − 2ab + b²'],['(a+b)(a−b)','a² − b²'],['aᵐ × aⁿ','aᵐ⁺ⁿ'],['aᵐ ÷ aⁿ','aᵐ⁻ⁿ'],['(aᵐ)ⁿ','aᵐⁿ'],['a⁰','1'],['a⁻ⁿ','1/aⁿ'],['a^(1/2)','√a']].forEach(function(p){d.push({q:'Expand / simplify:  '+p[0],a:p[1],g:'Algebra identities'})});
  [['Quadratic formula','x = (−b ± √(b²−4ac)) / 2a'],['Slope from 2 points','(y₂−y₁) / (x₂−x₁)'],['Distance formula','√((x₂−x₁)² + (y₂−y₁)²)'],['sin θ','opposite / hypotenuse'],['cos θ','adjacent / hypotenuse'],['tan θ','opposite / adjacent'],['sin²θ + cos²θ','1'],['d/dx xⁿ','n xⁿ⁻¹'],['d/dx sin x','cos x'],['d/dx eˣ','eˣ'],['d/dx ln x','1/x'],['∫xⁿ dx','xⁿ⁺¹/(n+1) + C'],['Area of circle','πr²'],['Volume of sphere','4/3 πr³'],['Pythagoras','a² + b² = c²'],['AP nth term','a + (n−1)d'],['GP nth term','a·rⁿ⁻¹'],['Simple interest','PRT / 100']].forEach(function(p){d.push({q:p[0]+' = ?',a:p[1],g:'Formulas'})});
  return d;
}

        setTimeout(function(){var t=document.querySelector('[data-tid="'+n.id+'"]');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.style.boxShadow='0 0 0 2px var(--acc2)';setTimeout(function(){t.style.boxShadow=''},2500)}},60);break}
      case 'tog':{var was=!!S.done[id];
        if(was){delete S.done[id];delete S.doneAt[id];toast('Unticked — back to the to-do list')}
        else{S.done[id]=true;S.doneAt[id]=today();
          var o=BYID[id],st=stageStat(o.sid);
          if(st.pct===100)toast('🏆 Stage complete: '+o.sname+'! On to the next one.');
          else toast('✓ Mastered: '+o.t.n+'  ('+st.pct+'% of this stage)');}
        save();render();topbar();break}
      case 'togglestage':{var k='s'+id;S.open[k]=!S.open[k];save();el.closest('.stage').classList.toggle('closed');
        var b=el.querySelector('span:last-child');if(b)b.textContent=S.open[k]?'−':'+';break}
      case 'openstage':{VIEW='road';S.open['s'+id]=true;ROADQ='';ROADF='all';save();renderTabs();render();
        setTimeout(function(){var s=document.querySelectorAll('.stage')[STAGES.map(function(x){return x.id}).indexOf(+id)];if(s)s.scrollIntoView({behavior:'smooth',block:'start'})},60);break}
      case 'steps':{S.open[id]=!S.open[id];save();render();break}
      case 'note':{S.open[id]=true;save();render();setTimeout(function(){var t=document.querySelector('[data-tid="'+id+'"] textarea');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.focus()}},60);break}
      case 'filter':ROADF=id;render();break;
      case 'expandall':FLAT.forEach(function(o){S.open[o.id]=true});STAGES.forEach(function(s){S.open['s'+s.id]=true});save();render();toast('All steps expanded — good for printing');break;
      case 'collapseall':S.open={};STAGES.forEach(function(s){if(s.id===currentStage())S.open['s'+s.id]=true});save();render();break;
      case 'acc':{var p=el.parentElement,bd=p.querySelector('.acc-b'),vis=bd.style.display!=='none';bd.style.display=vis?'none':'block';
        var sp=el.querySelector('span:last-child');if(sp)sp.textContent=vis?'+':'−';break}
      case 'jumptopic':{var o=BYID[id];VIEW='road';ROADQ='';ROADF='all';S.open['s'+o.sid]=true;S.open[id]=true;save();renderTabs();render();
        setTimeout(function(){var t=document.querySelector('[data-tid="'+id+'"]');if(t)t.scrollIntoView({behavior:'smooth',block:'center'})},60);break}
      case 'setmins':S.mins=+id;save();render();toast('Plan set to '+id+' minutes a day');break;
      case 'quicklog':addLog(+id);break;
      case 'addlog':{var v=+document.getElementById('logmin').value;if(!v||v<1){toast('Enter the number of minutes first');break}addLog(v);break}
      case 'dellog':delete S.log[id];save();render();toast('Entry removed');break;
      case 'dsub':killSprint();DR.sub=id;paint();break;
      case 'dmode':killSprint();DR.mode=id;DR.q=null;DR.i=0;DR.ok=0;DR.streak=0;DR.sq=0;DR.sok=0;DR.sprint=0;paint();break;
      case 'qstart':DR.i=0;DR.ok=0;DR.streak=0;DR.t0=Date.now();DR.fb=null;DR.q=GENQ(DR.mode);paint();break;
      case 'qclear':DR.q=null;DR.fb=null;paint();break;
      case 'qskip':case 'qshow':qReveal();break;
      case 'sstart':startSprint();break;
      case 'sskip':DR.q=GENQ(DR.mode);DR.fb=null;paint();break;
      case 'frev':DR.rev=!DR.rev;paint();break;
      case 'fgood':DR.okf++;DR.di++;DR.rev=false;paint();break;
      case 'fbad':DR.missf++;DR.missq=DR.missq||[];DR.missq.push(DR.deck[DR.di]);var c=DR.deck.splice(DR.di,1)[0];DR.deck.splice(Math.min(DR.di+2,DR.deck.length),0,c);DR.rev=false;paint();break;
      case 'frestart':DR.deck=[];DR.missq=[];paint();break;
      case 'fmissed':if(DR.missq&&DR.missq.length){DR.deck=DR.missq.slice();DR.missq=[];DR.di=0;DR.okf=0;DR.missf=0;DR.rev=false;paint()}else toast('No missed cards yet');break;
      case 'print':doPrint();break;
      case 'backup':S.lastBackup=today();save();download('math-progress-'+today()+'.json',JSON.stringify(S,null,1),'application/json');toast('Backup saved ✓ keep the .json file safe');render();break;
      case 'exportmd':download('math-roadmap-'+today()+'.md',toMD(),'text/markdown');toast('Roadmap exported as Markdown');break;
      case 'reset':if(confirm('Erase ALL progress, notes and logs? This cannot be undone. Download a backup first if unsure.')){S=JSON.parse(JSON.stringify(DEF));S.start=today();save();VIEW='dash';renderTabs();render();toast('Reset. Fresh start 🐣')}break;
      case 'onbgo':case 'onbskip':S.sonboard=true;save();document.getElementById('modal').classList.remove('on');if(act==='onbgo'){VIEW='road';S.open.s0=true;renderTabs();render();toast('Stage 0 is open. Start with counting 1–100 🚀')}break;
    }
  });
  app.addEventListener('change',function(e){
    var el=e.target.closest('[data-in]');if(!el)return;var k=el.getAttribute('data-in'),id=el.getAttribute('data-id');
    if(k==='tnote'){S.notes[id]=el.value;save();return}
    if(k==='scratch'){S.scratch=el.value;save();return}
    if(k==='lognote'){S.logNote=el.value;save();return}
    if(k==='restore'){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);for(var kk in DEF)if(o[kk]===undefined)o[kk]=DEF[kk];S=o;save();render();toast('Progress restored ✓')}catch(x){toast('That file could not be read')}};r.readAsText(f);return}
    if(k==='mins'){S.mins=Math.max(5,+el.value||45);save();render();return}
    if(k==='name'){S.name=el.value.trim();save();topbar();return}
    if(k==='start'){S.start=el.value;save();render();return}
  });
  var sDebounce=null;
  app.addEventListener('input',function(e){
    var el=e.target.closest('[data-in]');if(!el)return;var k=el.getAttribute('data-in'),id=el.getAttribute('data-id');
    if(k==='tnote'){S.notes[id]=el.value;save();return}
    if(k==='scratch'){S.scratch=el.value;save();return}
    if(k==='lognote'){S.logNote=el.value;save();return}
    if(k==='name'){S.name=el.value.trim();save();topbar();return}
    if(k==='search'){clearTimeout(sDebounce);var val=el.value;sDebounce=setTimeout(function(){ROADQ=val.trim();render();
      var s=document.getElementById('rsearch');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length)}},220);return}
  });
  app.addEventListener('submit',function(e){
    var f=e.target.closest('form');if(!f)return;e.preventDefault();
    var inp=f.querySelector('input');var v=(inp.value||'').trim().replace(/,/g,'');
    if(f.getAttribute('data-form')==='sprint'){
      if(v==='')return;var num=parseFloat(v);var good=isFinite(num)&&Math.abs(num-DR.q.a)<0.01;
      DR.sq++;if(good)DR.sok++;DR.sprint=DR.sok-(DR.sq-DR.sok);DR.q=GENQ(DR.mode);paint();return}
    if(!v)return;var n=parseFloat(v);var ok=Math.abs(n-DR.q.a)<0.001;
    if(ok){DR.ok++;DR.streak=(DR.streak||0)+1}else{DR.streak=0}
    DR.fb={ok:ok,ans:DR.q.a};paint();
    setTimeout(function(){DR.i++;DR.fb=null;
      if(DR.i>=DR.n){var secs=Math.round((Date.now()-DR.t0)/1000);var pct=Math.round(DR.ok/DR.n*100);
        S.drills.push({ts:new Date().toISOString(),mode:DR.mode,q:DR.n,ok:DR.ok,pct:pct,secs:secs});save()}
      else DR.q=GENQ(DR.mode);
      paint();topbar()},ok?600:1400);
  });
  document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')this.classList.remove('on')});
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();if(VIEW!=='road'){VIEW='road';renderTabs();render()}setTimeout(function(){var s=document.getElementById('rsearch');if(s)s.focus()},50)}
    if(e.key==='Escape')document.getElementById('modal').classList.remove('on');
  });
}
function bindExtra(){/* hooks for post-render focus */}
function addLog(m){var d=today();S.log[d]=(S.log[d]||0)+m;
  var n=(document.getElementById('lognote')||{}).value;if(n&&n.trim())S.log[d+'_note']=(S.log[d+'_note']||'')+' '+n.trim();
  save();render();toast('+'+m+' min logged · '+streak()+'-day streak 🔥')}
function download(name,txt,type){var b=new Blob([txt],{type:type||'text/plain'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},400)}
function doPrint(){var prev=VIEW;VIEW='road';ROADQ='';ROADF='all';STAGES.forEach(function(s){S.open['s'+s.id]=true});FLAT.forEach(function(o){S.open[o.id]=true});save();renderTabs();render();
  setTimeout(function(){window.print();S.open={};save();VIEW=prev;renderTabs();render()},250)}
function toMD(){
  var L2=['# Math: Zero → Hero — Complete Roadmap','',
   'Generated '+fmtDate(today())+' · Progress: '+doneCount()+'/'+TOT.topics+' topics ('+Math.round(doneCount()/TOT.topics*100)+'%) · '+doneHours()+' of '+Math.round(TOT.hours)+' hours · Streak: '+streak()+' days',''];
  STAGES.forEach(function(st){var s=stageStat(st.id);
    L2.push('## '+st.t+'  — '+s.pct+'% ('+s.dn+'/'+s.tot+')');L2.push('_'+st.sub+'_');L2.push('');L2.push('> **Goal:** '+st.goal);L2.push('');
    st.mods.forEach(function(m){L2.push('### '+m.t);L2.push('');
      m.topics.forEach(function(t,ti){var id=st.id+'-'+st.mods.indexOf(m)+'-'+ti;
        L2.push('- ['+(S.done[id]?'x':' ')+'] **'+t.n+'**  (~'+t.h+'h)'+(S.doneAt[id]?' — done '+S.doneAt[id]:''));
        t.s.forEach(function(x){L2.push('    - '+x)});
        L2.push('    - ✔ Mastered when: '+t.m);
        if(S.notes[id])L2.push('    - 📝 Note: '+S.notes[id].replace(/\n/g,' '));
        if(t.r&&t.r.length)L2.push('    - 🔗 '+t.r.map(function(r){return '['+r[0]+']('+r[1]+')'}).join(' · '));
        L2.push('')});});});
  if(S.scratch)L2.push('## Scratchpad','',S.scratch,'');
  L2.push('## Study log','', '| Date | Minutes |','|---|---|');
  Object.keys(S.log).filter(function(k){return k.indexOf('_')<0}).sort().reverse().slice(0,60).forEach(function(d){L2.push('| '+d+' | '+S.log[d]+' |')});
  return L2.join('\n');
}

/* ================= BOOT ================= */
renderTabs();render();bind();topbar();
if(!S.sonboard)setTimeout(onb,500);
</script>
